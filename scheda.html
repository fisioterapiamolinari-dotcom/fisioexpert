<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>La tua scheda esercizi | Fisio Expert</title>
<meta name="theme-color" content="#f47920">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="I miei esercizi">
<link rel="apple-touch-icon" href="/icona-esercizi.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1a1a; --ink-soft: #4a4a4a; --ink-muted: #8a8a8a;
  --accent: #f47920; --accent-light: rgba(244,121,32,0.12); --accent-dark: #d4660e;
  --warm: #f8f4ef; --warm-dark: #ede8e0; --white: #ffffff;
  --border: rgba(26,26,26,0.1);
  --green: #2e9e5b; --green-light: rgba(46,158,91,0.12);
  --serif: 'DM Serif Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --mono: 'Montserrat', system-ui, sans-serif;
}
body {
  font-family: var(--sans); background: var(--warm); color: var(--ink);
  line-height: 1.6; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(104px + env(safe-area-inset-bottom));
}
.wrap { max-width: 640px; margin: 0 auto; padding: 0 18px; }

/* Header */
header { background: var(--white); border-bottom: 1px solid var(--border); padding: 16px 0; padding-top: calc(16px + env(safe-area-inset-top)); }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: inline-flex; align-items: center; text-decoration: none; }
.header-logo { height: 36px; width: auto; display: block; }
.logo-fallback { display: none; font-family: var(--mono); font-weight: 800; font-size: 20px; letter-spacing: -0.5px; color: var(--ink); }
.logo-fallback b { color: var(--accent); font-weight: inherit; }
.chi { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-muted); text-align: right; }

/* Intestazione scheda */
.testata { padding: 26px 0 6px; }
.testata h1 { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.15; margin-bottom: 6px; }
.testata p { font-size: 15px; color: var(--ink-soft); }

/* Fasi */
.fasi { display: flex; gap: 8px; overflow-x: auto; padding: 18px 0 4px; scrollbar-width: none; }
.fasi::-webkit-scrollbar { display: none; }
.fase-pill {
  flex-shrink: 0; font-family: var(--mono); font-weight: 700; font-size: 12px;
  padding: 9px 15px; border-radius: 100px; border: 1.5px solid var(--border);
  background: var(--white); color: var(--ink-soft); cursor: pointer;
}
.fase-pill.attiva { background: var(--accent); border-color: var(--accent); color: var(--white); }
.fase-pill.bloccata { opacity: .5; cursor: default; }

.card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 16px; }
.card h2 { font-family: var(--serif); font-weight: 400; font-size: 20px; margin-bottom: 10px; }
.etichetta { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }

/* Esercizio */
.esercizio {
  background: var(--white); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; margin-top: 12px; cursor: pointer; transition: border-color .15s, background .15s;
}
.esercizio.fatto { border-color: var(--green); background: var(--green-light); }
.es-top { display: flex; align-items: flex-start; gap: 14px; }
.es-info { flex: 1; min-width: 0; }
.es-nome { font-weight: 500; font-size: 16px; line-height: 1.35; }
.es-dose { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--accent); margin-top: 4px; }
.es-nota { font-size: 13px; color: var(--ink-muted); margin-top: 2px; }
.spunta {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid var(--border); background: var(--white);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; color: transparent; transition: all .15s;
}
.esercizio.fatto .spunta { border-color: var(--green); background: var(--green); color: var(--white); }
.es-desc { font-size: 14px; color: var(--ink-soft); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: none; }
.esercizio.aperto .es-desc { display: block; }
.es-toggle { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .5px; color: var(--accent); background: none; border: none; padding: 8px 0 0; cursor: pointer; }

/* Calendario */
.cal-testa { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.cal-mese { font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-muted); }
.serie-num { font-family: var(--mono); font-weight: 800; font-size: 15px; color: var(--accent); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-gg { font-family: var(--mono); font-weight: 700; font-size: 10px; color: var(--ink-muted); text-align: center; padding-bottom: 4px; }
.cal-cella { aspect-ratio: 1; border-radius: 9px; background: var(--warm-dark); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink-muted); }
.cal-cella.vuota { background: transparent; }
.cal-cella.fatto { background: var(--accent); color: var(--white); font-weight: 600; }
.cal-cella.oggi { box-shadow: 0 0 0 2px var(--ink); }
.riepilogo { font-size: 14px; color: var(--ink-soft); margin-top: 14px; }

/* Barra check-in */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--white); border-top: 1px solid var(--border);
  padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
}
.barra-inner { max-width: 640px; margin: 0 auto; }
.btn-fatto {
  width: 100%; font-family: var(--mono); font-weight: 800; font-size: 16px; letter-spacing: .5px;
  background: var(--accent); color: var(--white); border: none;
  padding: 18px; border-radius: 100px; cursor: pointer;
}
.btn-fatto:active { background: var(--accent-dark); }
.btn-fatto.registrato { background: var(--green); }
.sotto-barra { text-align: center; font-size: 13px; color: var(--ink-muted); margin-top: 8px; min-height: 20px; }
.sotto-barra button { background: none; border: none; color: var(--ink-muted); font-size: 13px; text-decoration: underline; cursor: pointer; font-family: var(--sans); }

/* Avvisi */
.avviso { background: var(--accent-light); border: 1px solid var(--accent); border-radius: 14px; padding: 16px; margin-top: 16px; font-size: 14px; color: var(--ink-soft); }
.avviso strong { color: var(--ink); }
.avviso .chiudi { float: right; background: none; border: none; font-size: 20px; color: var(--ink-muted); cursor: pointer; line-height: 1; margin: -4px -4px 0 8px; }
.stato-carico { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
footer { text-align: center; font-size: 12px; color: var(--ink-muted); padding: 28px 18px 10px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="https://fisioexpert.it" class="logo">
      <img src="/logo.png" width="671" height="135" alt="fisio·expert" class="header-logo"
           onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='inline';">
      <span id="logoFallback" class="logo-fallback">fisio<b>·</b>expert</span>
    </a>
    <div class="chi" id="chi"></div>
  </div>
</header>

<main class="wrap" id="contenuto">
  <div class="stato-carico" id="caricamento">Carico la tua scheda…</div>
</main>

<div class="barra" id="barra" style="display:none">
  <div class="barra-inner">
    <button class="btn-fatto" id="btnFatto" onclick="registraSeduta()">Fatto oggi ✓</button>
    <div class="sotto-barra" id="sottoBarra"></div>
  </div>
</div>

<footer>Fisio Expert Roma · +39 328 273 8164<br>Se qualcosa fa male più del solito, scrivimi prima di continuare.</footer>

<script>
/* ============================================================
   CONFIGURAZIONE — incolla qui l'URL della Web App Apps Script
   ============================================================ */
const APPS_SCRIPT_URL = 'INSERISCI_QUI_URL_WEB_APP';

const ID = new URLSearchParams(location.search).get('id') || '';
const K_CACHE = 'fe_scheda_' + ID;
const K_CODA  = 'fe_coda_' + ID;
const GIORNI = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

let scheda = null;
let faseVista = 0;
let spunte = {};      // indice esercizio → true
let inviato = false;  // seduta di oggi già registrata

/* ---------- Utilità ---------- */
function oggiISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function leggiLocale(chiave, fallback) {
  try { const v = localStorage.getItem(chiave); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function scriviLocale(chiave, valore) {
  try { localStorage.setItem(chiave, JSON.stringify(valore)); } catch (e) {}
}

/* ---------- Manifest generato al volo (installazione su Android) ---------- */
(function () {
  const manifest = {
    name: 'I miei esercizi · Fisio Expert',
    short_name: 'Esercizi',
    start_url: location.pathname + location.search,
    display: 'standalone',
    background_color: '#f8f4ef',
    theme_color: '#f47920',
    icons: [{ src: '/icona-esercizi.png', sizes: '180x180', type: 'image/png' }]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

/* ---------- Caricamento ---------- */
async function carica() {
  if (!ID) { erroreFatale('Manca il codice della scheda nel link. Chiedi a Gianmarco di rimandartelo.'); return; }

  const cache = leggiLocale(K_CACHE, null);
  if (cache) { scheda = cache; disegna(); }

  try {
    const r = await fetch(APPS_SCRIPT_URL + '?action=scheda&id=' + encodeURIComponent(ID));
    const d = await r.json();
    if (!d.ok) throw new Error(d.errore || 'Scheda non trovata');
    scheda = d;
    scriviLocale(K_CACHE, d);
    disegna();
  } catch (e) {
    if (!scheda) erroreFatale('Non riesco a caricare la scheda. Controlla la connessione e riapri il link.');
  }
  svuotaCoda();
}

function erroreFatale(messaggio) {
  document.getElementById('contenuto').innerHTML = '<div class="avviso" style="margin-top:40px">' + messaggio + '</div>';
}

/* ---------- Storico: server + code locali non ancora inviate ---------- */
function storicoCompleto() {
  const date = (scheda.storico || []).map(function (s) { return s.data; });
  leggiLocale(K_CODA, []).forEach(function (c) {
    if (!c.annulla && date.indexOf(c.data) === -1) date.push(c.data);
  });
  const annullate = leggiLocale(K_CODA, []).filter(function (c) { return c.annulla; }).map(function (c) { return c.data; });
  return date.filter(function (d) { return annullate.indexOf(d) === -1; }).sort();
}

function serieAttuale(date) {
  const set = {};
  date.forEach(function (d) { set[d] = true; });
  const d = new Date();
  if (!set[oggiISO()]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (true) {
    const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (!set[iso]) break;
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

/* ---------- Disegno ---------- */
function disegna() {
  const fasi = scheda.fasi || [];
  faseVista = Math.min(scheda.faseAttiva || 0, fasi.length - 1);
  const date = storicoCompleto();
  inviato = date.indexOf(oggiISO()) !== -1;

  document.getElementById('chi').textContent = scheda.paziente || '';

  let html = '';

  html += '<div class="testata">';
  html += '<h1>' + esc(scheda.paziente ? scheda.paziente.split(' ')[0] : 'La tua scheda') + ', ecco i tuoi esercizi</h1>';
  html += '<p>Segna la seduta quando l\'hai finita. Un tocco e basta.</p>';
  html += '</div>';

  if (fasi.length > 1) {
    html += '<div class="fasi" id="fasi"></div>';
  }

  html += '<div id="listaEsercizi"></div>';

  if (scheda.indicazioni) {
    html += '<div class="card"><div class="etichetta">Indicazioni generali</div><p style="color:var(--ink-soft);font-size:15px">' + esc(scheda.indicazioni).replace(/\n/g, '<br>') + '</p></div>';
  }

  html += '<div class="card" id="cardCal"></div>';

  if (!window.matchMedia('(display-mode: standalone)').matches && !window.navigator.standalone && !leggiLocale('fe_installa_chiuso', false)) {
    html += '<div class="avviso" id="avvisoInstalla">'
          + '<button class="chiudi" onclick="chiudiAvviso()">×</button>'
          + '<strong>Tienila a portata di mano.</strong> Dal menu del browser scegli "Aggiungi a schermata Home": '
          + 'ti resta un\'icona accanto a WhatsApp e non devi più cercare il link.'
          + '</div>';
  }

  document.getElementById('caricamento')?.remove();
  document.getElementById('contenuto').innerHTML = html;

  disegnaFasi();
  disegnaEsercizi();
  disegnaCalendario(date);
  aggiornaBarra();
  document.getElementById('barra').style.display = 'block';
}

function disegnaFasi() {
  const cont = document.getElementById('fasi');
  if (!cont) return;
  cont.innerHTML = '';
  (scheda.fasi || []).forEach(function (f, i) {
    const b = document.createElement('button');
    b.className = 'fase-pill' + (i === faseVista ? ' attiva' : '') + (f.sbloccata ? '' : ' bloccata');
    b.textContent = (f.sbloccata ? '' : '🔒 ') + (f.nome || ('Fase ' + (i + 1)));
    if (f.sbloccata) b.onclick = function () { faseVista = i; spunte = {}; disegnaFasi(); disegnaEsercizi(); aggiornaBarra(); };
    cont.appendChild(b);
  });
}

function disegnaEsercizi() {
  const fase = (scheda.fasi || [])[faseVista];
  const cont = document.getElementById('listaEsercizi');
  if (!fase) { cont.innerHTML = ''; return; }

  let html = '';
  const superata = faseVista < (scheda.faseAttiva || 0);
  if (superata) {
    html += '<div class="avviso" style="background:var(--warm-dark);border-color:var(--border)">Questa fase è già stata completata. La stai solo rivedendo.</div>';
  }

  (fase.esercizi || []).forEach(function (e, i) {
    html += '<div class="esercizio' + (spunte[i] ? ' fatto' : '') + '" id="es' + i + '" onclick="tocca(' + i + ')">'
          +   '<div class="es-top">'
          +     '<div class="es-info">'
          +       '<div class="es-nome">' + esc(e.nome) + '</div>'
          +       '<div class="es-dose">' + esc([e.serie ? e.serie + ' serie' : '', e.rip || ''].filter(Boolean).join(' × ')) + '</div>'
          +       (e.note ? '<div class="es-nota">' + esc(e.note) + '</div>' : '')
          +     '</div>'
          +     '<div class="spunta">✓</div>'
          +   '</div>'
          +   (e.desc ? '<button class="es-toggle" onclick="event.stopPropagation();apri(' + i + ')">Come si esegue</button>'
          +             '<div class="es-desc">' + esc(e.desc) + '</div>' : '')
          + '</div>';
  });

  cont.innerHTML = html;
}

function disegnaCalendario(date) {
  const set = {};
  date.forEach(function (d) { set[d] = true; });
  const oggi = new Date();
  const anno = oggi.getFullYear(), mese = oggi.getMonth();
  const primo = new Date(anno, mese, 1);
  const offset = (primo.getDay() + 6) % 7;
  const giorniMese = new Date(anno, mese + 1, 0).getDate();
  const serie = serieAttuale(date);

  let html = '<div class="cal-testa"><span class="cal-mese">' + MESI[mese] + ' ' + anno + '</span>';
  if (serie > 0) html += '<span class="serie-num">' + serie + ' ' + (serie === 1 ? 'giorno' : 'giorni') + ' di fila</span>';
  html += '</div><div class="cal">';

  GIORNI.forEach(function (g) { html += '<div class="cal-gg">' + g + '</div>'; });
  for (let i = 0; i < offset; i++) html += '<div class="cal-cella vuota"></div>';

  let nelMese = 0;
  for (let g = 1; g <= giorniMese; g++) {
    const iso = anno + '-' + String(mese + 1).padStart(2, '0') + '-' + String(g).padStart(2, '0');
    const fatto = !!set[iso];
    if (fatto) nelMese++;
    html += '<div class="cal-cella' + (fatto ? ' fatto' : '') + (g === oggi.getDate() ? ' oggi' : '') + '">' + g + '</div>';
  }
  html += '</div><div class="riepilogo">' + nelMese + ' sedute questo mese · ' + date.length + ' da quando hai iniziato</div>';

  document.getElementById('cardCal').innerHTML = html;
}

/* ---------- Interazione ---------- */
function tocca(i) {
  spunte[i] = !spunte[i];
  document.getElementById('es' + i).classList.toggle('fatto', !!spunte[i]);
  aggiornaBarra();
}
function apri(i) {
  document.getElementById('es' + i).classList.toggle('aperto');
}
function chiudiAvviso() {
  scriviLocale('fe_installa_chiuso', true);
  document.getElementById('avvisoInstalla').remove();
}

function aggiornaBarra() {
  const btn = document.getElementById('btnFatto');
  const sotto = document.getElementById('sottoBarra');
  const superata = faseVista < (scheda.faseAttiva || 0);

  if (superata) {
    btn.style.display = 'none';
    sotto.textContent = 'Fase completata.';
    return;
  }
  btn.style.display = 'block';

  if (inviato) {
    btn.textContent = 'Seduta di oggi registrata ✓';
    btn.classList.add('registrato');
    btn.disabled = true;
    sotto.innerHTML = '<button onclick="annullaSeduta()">Non l\'ho fatta, annulla</button>';
  } else {
    const n = Object.keys(spunte).filter(function (k) { return spunte[k]; }).length;
    btn.textContent = n > 0 ? ('Fatto ✓ (' + n + ' esercizi)') : 'Fatto oggi ✓';
    btn.classList.remove('registrato');
    btn.disabled = false;
    sotto.textContent = n > 0 ? '' : 'Se non spunti nulla, conto la seduta come completa.';
  }
}

/* ---------- Invio ---------- */
function registraSeduta() {
  const fase = (scheda.fasi || [])[faseVista] || { esercizi: [] };
  const tutti = fase.esercizi || [];
  const scelti = Object.keys(spunte).filter(function (k) { return spunte[k]; }).map(Number);
  const nomi = (scelti.length ? scelti.map(function (i) { return tutti[i].nome; }) : tutti.map(function (e) { return e.nome; }));

  const messaggio = {
    action: 'checkin',
    id: ID,
    data: oggiISO(),
    fase: faseVista,
    eserciziFatti: nomi,
    eserciziTotali: tutti.length
  };

  inviato = true;
  aggiornaBarra();
  disegnaCalendario(storicoCompleto().concat([oggiISO()]));
  accodaEInvia(messaggio);
}

function annullaSeduta() {
  inviato = false;
  spunte = {};
  aggiornaBarra();
  disegnaEsercizi();
  accodaEInvia({ action: 'checkin', id: ID, data: oggiISO(), annulla: true });
  disegnaCalendario(storicoCompleto().filter(function (d) { return d !== oggiISO(); }));
}

/* La coda locale garantisce che un check-in fatto senza campo parta alla riapertura. */
function accodaEInvia(messaggio) {
  const coda = leggiLocale(K_CODA, []).filter(function (c) { return c.data !== messaggio.data; });
  coda.push(messaggio);
  scriviLocale(K_CODA, coda);
  svuotaCoda();
}

async function svuotaCoda() {
  const coda = leggiLocale(K_CODA, []);
  if (!coda.length || APPS_SCRIPT_URL.indexOf('INSERISCI') === 0) return;

  const rimaste = [];
  for (const messaggio of coda) {
    try {
      const r = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(messaggio)
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.errore || 'errore');
    } catch (e) {
      rimaste.push(messaggio);
    }
  }
  scriviLocale(K_CODA, rimaste);
}

window.addEventListener('online', svuotaCoda);
document.addEventListener('visibilitychange', function () { if (!document.hidden) svuotaCoda(); });

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

carica();
</script>

</body>
</html>
