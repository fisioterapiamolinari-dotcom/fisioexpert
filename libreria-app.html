<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Libreria video | Fisio Expert</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a1a; --ink-soft:#4a4a4a; --ink-muted:#6f6f6f;
  --accent:#f47920; --accent-dark:#b9560a; --accent-light:rgba(244,121,32,.12);
  --warm:#f8f4ef; --warm-dark:#ede8e0; --white:#fff;
  --green:#22794a;
  --serif:'DM Serif Display',Georgia,serif;
  --mono:'Montserrat',system-ui,sans-serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
[hidden] { display:none !important; }
body { font-family:var(--sans); background:var(--warm); color:var(--ink); line-height:1.5; padding:0 16px 64px; }
.pagina { max-width:760px; margin:0 auto; }
header { padding:28px 0 8px; }
.logo { height:34px; width:auto; display:block; margin-bottom:22px; }
h1 { font-family:var(--serif); font-weight:400; font-size:34px; line-height:1.15; }
.sotto { color:var(--ink-soft); margin-top:6px; }

.barra { position:sticky; top:0; z-index:5; background:var(--warm); padding:14px 0 12px; border-bottom:1px solid var(--warm-dark); }
.avanzamento { font-family:var(--mono); font-weight:700; font-size:13px; }
.progresso { height:6px; background:var(--warm-dark); border-radius:100px; margin:8px 0 12px; overflow:hidden; }
.progresso div { height:100%; width:0; background:var(--accent); transition:width .2s; }
.controlli { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
#cerca { flex:1 1 200px; min-height:44px; padding:0 14px; font:inherit; font-size:16px; color:var(--ink); background:var(--white); border:1px solid var(--warm-dark); border-radius:10px; }
.chip { font-family:var(--mono); font-weight:700; font-size:12px; min-height:44px; padding:0 14px; border-radius:100px; border:1px solid var(--warm-dark); background:var(--white); color:var(--ink-soft); cursor:pointer; }
.chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--white); }
.inquadrature { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.tab { font-family:var(--mono); font-weight:800; font-size:14px; min-height:52px; padding:6px 10px; border-radius:12px; border:2px solid var(--warm-dark); background:var(--white); color:var(--ink-soft); cursor:pointer; }
.tab small { display:block; font-weight:700; font-size:11px; }
.tab[aria-pressed="true"] { background:var(--accent-light); border-color:var(--accent); color:var(--accent-dark); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

h2 { font-family:var(--serif); font-weight:400; font-size:26px; margin-top:34px; }
.orient-nota { color:var(--ink-muted); font-size:14px; }
h3 { font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-muted); margin:22px 0 8px; }
ul { list-style:none; display:grid; gap:6px; }

.voce { background:var(--white); border:1px solid var(--warm-dark); border-radius:12px; }
.riga { display:flex; align-items:flex-start; gap:10px; cursor:pointer; padding:11px 14px; min-height:46px; }
.riga input { width:22px; height:22px; margin-top:1px; flex:none; accent-color:var(--green); cursor:pointer; }
.nome { font-weight:500; }
.voce.fatta .nome { color:var(--ink-muted); text-decoration:line-through; }
.tag { display:inline-block; font-family:var(--mono); font-weight:700; font-size:10px; letter-spacing:.3px; padding:2px 8px; border-radius:100px; margin-left:6px; white-space:nowrap; vertical-align:1px; }
.tag.conta { background:var(--accent-light); color:var(--accent-dark); }
.tag.conferma, .tag.inattiva { background:var(--warm-dark); color:var(--ink-soft); }
.doppione { display:block; font-size:13px; color:var(--ink-muted); margin-top:1px; }
.vuoto { text-align:center; color:var(--ink-muted); padding:48px 0; }
.nota-salvataggio { color:var(--ink-muted); font-size:13px; margin-top:36px; }
@media (max-width:480px) { h1 { font-size:29px; } }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <img class="logo" src="logo.png" alt="Fisio Expert">
    <h1>Video esercizi da girare</h1>
    <p class="sotto">Spunta un esercizio quando hai registrato il video.</p>
  </header>

  <div class="barra">
    <div class="avanzamento" id="conteggio"></div>
    <div class="progresso"><div id="barra-progresso"></div></div>
    <div class="inquadrature">
      <button class="tab" data-orient="Orizzontale" aria-pressed="true"></button>
      <button class="tab" data-orient="Verticale" aria-pressed="false"></button>
    </div>
    <div class="controlli">
      <input id="cerca" type="search" placeholder="Cerca un esercizio" aria-label="Cerca un esercizio">
      <button class="chip" data-filtro="da" aria-pressed="true">Da girare</button>
      <button class="chip" data-filtro="fatti" aria-pressed="false">Girati</button>
      <button class="chip" data-filtro="tutti" aria-pressed="false">Tutti</button>
    </div>
  </div>

  <main id="elenco"></main>
  <p class="vuoto" id="vuoto" hidden>Nessun esercizio in questa vista.</p>
  <p class="nota-salvataggio">Le spunte restano salvate solo in questo browser.</p>
</div>

const CHIAVE = "libreria-app-v2";
let girati = {};
try { girati = JSON.parse(localStorage.getItem(CHIAVE)) || {}; } catch (e) { girati = {}; }
function salva() { try { localStorage.setItem(CHIAVE, JSON.stringify(girati)); } catch (e) {} }

const righe = [];
let filtro = "da";
let inquadratura = "Orizzontale";

function crea(tag, classe, testo) {
  const el = document.createElement(tag);
  if (classe) el.className = classe;
  if (testo !== undefined) el.textContent = testo;
  return el;
}

function creaVoce([nome, pazienti, flag, doppione], orient) {
  const li = crea("li", "voce");
  const riga = crea("label", "riga");
  const spunta = crea("input");
  spunta.type = "checkbox";
  spunta.checked = !!girati[nome];

  const testo = crea("span");
  testo.append(crea("span", "nome", nome));
  if (pazienti > 1) testo.append(crea("span", "tag conta", pazienti + " pazienti"));
  if (flag === "dc") testo.append(crea("span", "tag conferma", "Orientamento da confermare"));
  if (flag === "na") testo.append(crea("span", "tag inattiva", "Scheda non attiva"));
  if (doppione) testo.append(crea("span", "doppione", "Forse stesso video di: " + doppione));
  riga.append(spunta, testo);
  li.append(riga);

  spunta.addEventListener("change", () => {
    if (spunta.checked) girati[nome] = true; else delete girati[nome];
    li.classList.toggle("fatta", spunta.checked);
    salva();
    aggiornaConteggi();
    applicaFiltro();
  });

  li.classList.toggle("fatta", spunta.checked);
  righe.push({ li, nome, spunta, orient });
  return li;
}

const elenco = document.getElementById("elenco");
LISTA.forEach(o => {
  const sezione = crea("section");
  sezione.append(crea("h2", "", o.orientamento), crea("p", "orient-nota", o.nota));
  o.gruppi.forEach(g => {
    const blocco = crea("div", "gruppo");
    const ul = crea("ul");
    [...g.voci].sort((a, b) => a[0].localeCompare(b[0], "it")).forEach(v => ul.append(creaVoce(v, o.orientamento)));
    blocco.append(crea("h3", "", g.titolo), ul);
    sezione.append(blocco);
  });
  elenco.append(sezione);
});

function aggiornaConteggi() {
  const totale = righe.length;
  const fatti = righe.filter(r => r.spunta.checked).length;
  document.getElementById("conteggio").textContent = (totale - fatti) + " da girare su " + totale;
  document.getElementById("barra-progresso").style.width = (fatti / totale * 100) + "%";
  document.querySelectorAll(".tab").forEach(t => {
    const mancanti = righe.filter(r => r.orient === t.dataset.orient && !r.spunta.checked).length;
    t.textContent = t.dataset.orient === "Orizzontale" ? "Orizzontali" : "Verticali";
    t.append(crea("small", "", mancanti + " da girare"));
  });
}

function normalizza(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

function applicaFiltro() {
  const q = normalizza(document.getElementById("cerca").value.trim());
  let visibili = 0;
  righe.forEach(r => {
    const statoOk = filtro === "tutti" || (filtro === "fatti") === r.spunta.checked;
    /* La ricerca guarda in entrambe le inquadrature */
    const orientOk = q !== "" || r.orient === inquadratura;
    const mostra = statoOk && orientOk && normalizza(r.nome).includes(q);
    r.li.hidden = !mostra;
    if (mostra) visibili++;
  });
  document.querySelectorAll(".gruppo").forEach(g => { g.hidden = !g.querySelector("li:not([hidden])"); });
  document.querySelectorAll("#elenco section").forEach(s => { s.hidden = !s.querySelector(".gruppo:not([hidden])"); });
  document.getElementById("vuoto").hidden = visibili > 0;
}

document.getElementById("cerca").addEventListener("input", applicaFiltro);
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  inquadratura = t.dataset.orient;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === t));
  applicaFiltro();
  window.scrollTo(0, 0);
}));
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  filtro = c.dataset.filtro;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  applicaFiltro();
}));

aggiornaConteggi();
applicaFiltro();
</script>

</html>
