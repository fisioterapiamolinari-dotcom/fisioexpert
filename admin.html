<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest-app.json">
<link rel="apple-touch-icon" href="/icona-app-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:#1a1a1a; --ink-soft:#4a4a4a; --ink-muted:#8a8a8a;
  --accent:#f47920; --accent-light:rgba(244,121,32,0.12); --accent-dark:#d4660e;
  --warm:#f8f4ef; --warm-dark:#ede8e0; --white:#fff;
  --border:rgba(26,26,26,0.1);
  --green:#2e9e5b; --green-light:rgba(46,158,91,0.12); --rosso:#c0392b;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'Montserrat',system-ui,sans-serif;
}
body { font-family:var(--sans); background:var(--warm); color:var(--ink); line-height:1.5; min-height:100vh; }
.wrap { max-width:980px; margin:0 auto; padding:0 16px; }

header { background:var(--white); border-bottom:1px solid var(--border); padding:16px 0 0; position:sticky; top:0; z-index:20; }
header .riga { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.logo { display:inline-flex; align-items:center; text-decoration:none; }
.header-logo { height:36px; width:auto; display:block; }
.logo-fallback { display:none; font-family:var(--mono); font-weight:800; font-size:20px; letter-spacing:-.5px; color:var(--ink); }
.logo-fallback b { color:var(--accent); font-weight:inherit; }
.tag { font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-muted); }
.btn-esci { font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-muted); background:none; border:0; cursor:pointer; padding:8px 0 8px 12px; }
nav { display:flex; gap:4px; margin-top:12px; overflow-x:auto; scrollbar-width:none; }
nav a { font-family:var(--mono); font-weight:700; font-size:13px; color:var(--ink-muted); text-decoration:none; padding:10px 12px 12px; border-bottom:3px solid transparent; white-space:nowrap; }
nav a.attiva { color:var(--ink); border-color:var(--accent); }
nav .conta { background:var(--accent); color:var(--white); border-radius:10px; padding:1px 7px; font-size:11px; margin-left:4px; }

h1 { font-family:var(--serif); font-weight:400; font-size:30px; line-height:1.15; margin:26px 0 6px; }
h2 { font-family:var(--serif); font-weight:400; font-size:22px; line-height:1.2; margin:26px 0 10px; }
.sotto { color:var(--ink-soft); font-size:15px; margin-bottom:18px; }
.etichetta { font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-muted); margin-bottom:6px; display:block; }
.card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:12px; }
a { color:var(--accent-dark); }

input, select, textarea {
  width:100%; font-family:var(--sans); font-size:15px; color:var(--ink);
  padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--white); outline:none;
}
input:focus, select:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
textarea { resize:vertical; }
.campo { margin-bottom:12px; }
.griglia2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px) { .griglia2 { grid-template-columns:1fr; } }

.btn { display:inline-block; text-align:center; text-decoration:none; font-family:var(--mono); font-weight:700; font-size:14px; letter-spacing:.3px;
  border:0; border-radius:12px; padding:13px 18px; cursor:pointer; background:var(--accent); color:var(--white); }
.btn:hover { background:var(--accent-dark); }
.btn:disabled { opacity:.6; cursor:wait; }
.btn-sec { background:var(--white); color:var(--ink); border:1px solid var(--border); }
.btn-sec:hover { background:var(--warm-dark); }
.btn-pericolo { background:var(--white); color:var(--rosso); border:1px solid rgba(192,57,43,.35); }
.btn-pericolo:hover { background:rgba(192,57,43,.06); }
.btn-piccolo { padding:8px 12px; font-size:12px; border-radius:9px; }
.btn-largo { display:block; width:100%; padding:16px; font-size:16px; }
.azioni { display:flex; flex-wrap:wrap; gap:8px; }
.link { background:none; border:0; color:var(--accent-dark); font-family:var(--mono); font-weight:700; font-size:12px; cursor:pointer; padding:4px 0; }

.badge { display:inline-block; font-family:var(--mono); font-weight:700; font-size:10px; letter-spacing:.4px; text-transform:uppercase; border-radius:20px; padding:3px 8px; white-space:nowrap; }
.badge.ok { background:var(--green-light); color:var(--green); }
.badge.attesa { background:var(--accent-light); color:var(--accent-dark); }
.badge.spento { background:var(--warm-dark); color:var(--ink-soft); }

/* Elenco pazienti */
.cerca { margin-bottom:12px; }
.paziente { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
.paziente:hover { border-color:rgba(244,121,32,.4); }
.paziente .iniziali { flex:0 0 44px; height:44px; border-radius:50%; background:var(--warm-dark); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:800; font-size:14px; }
.paziente .testo { flex:1; min-width:0; }
.paziente .nome { font-weight:700; display:block; }
.paziente .info { color:var(--ink-muted); font-size:13px; display:block; }

/* Editor scheda */
.esempio { background:var(--warm); border-radius:10px; padding:10px 12px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; color:var(--ink-soft); white-space:pre-wrap; margin-bottom:10px; }
#testoScheda { min-height:260px; font-family:ui-monospace,Menlo,monospace; font-size:14px; line-height:1.55; }
.righe-ed .giorno-testa { font-family:var(--serif); font-size:19px; margin:24px 0 4px; }
.righe-ed .giorno-testa:first-child { margin-top:2px; }
/* ogni esercizio su due righe: i campi vanno a capo invece di tagliare il testo */
.righe-ed .l1 { display:grid; grid-template-columns:150px minmax(0,1fr) 46px 46px 70px 66px; gap:5px; }
.righe-ed .l2 { display:grid; grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) minmax(0,2.2fr) minmax(0,1.3fr); gap:5px; }
.righe-ed .intest { font-family:var(--mono); font-weight:700; font-size:9.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-muted); padding:0 2px; }
.righe-ed .intest.l1 { margin-bottom:1px; } .righe-ed .intest.l2 { margin-bottom:4px; opacity:.8; }
.righe-ed .riga-es { background:var(--warm); border-radius:10px; padding:5px; margin-bottom:5px; }
.righe-ed .riga-es .l2 { margin-top:5px; }
.righe-ed input, .righe-ed textarea { padding:5px 7px; font-size:13px; border-radius:7px; line-height:1.35; }
.righe-ed textarea { resize:none; overflow:hidden; display:block; min-height:29px; }
.righe-ed input[data-c="nome"] { font-weight:700; }
.righe-ed .f::before { display:none; }
.riga-tools { display:flex; gap:2px; }
.riga-tools button { background:none; border:0; color:var(--ink-muted); font-size:16px; cursor:pointer; padding:6px 5px; }
.riga-tools button:hover { color:var(--ink); }
.ultimo { font-size:12px; color:var(--ink-muted); margin-top:3px; line-height:1.35; }
.ultimo b { color:var(--green); font-weight:700; }
.progressione { border-color:rgba(244,121,32,.45); }
.progressione .comandi { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-top:10px; }
.progressione .comandi > div { min-width:120px; }
.progressione .comandi input { width:90px; }
.scorri { overflow-x:auto; }
@media (max-width:760px) {
  .righe-ed .intest { display:none; }
  .righe-ed .l1, .righe-ed .l2 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .righe-ed .f.largo { grid-column:1 / -1; }
  .righe-ed .f::before { content:attr(data-label); display:block; font-family:var(--mono); font-weight:700; font-size:9px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-muted); }
}

/* Dettaglio paziente */
.dati-paziente { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px 18px; font-size:14px; }
.dati-paziente b { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-muted); }
details.sessione { background:var(--white); border:1px solid var(--border); border-radius:14px; margin-bottom:8px; }
details.sessione summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
details.sessione summary::-webkit-details-marker { display:none; }
details.sessione .corpo { padding:0 16px 14px; font-size:14px; }
details.sessione .corpo .es { margin-bottom:6px; }
details.sessione .nota { background:var(--accent-light); border-radius:10px; padding:8px 10px; margin-top:8px; }
.nota-flag { color:var(--accent-dark); font-weight:700; }

/* Grafici progressi: una linea per esercizio (small multiples) */
/* Scheda per giorni: risultati e commenti (uguale a quella che vede il paziente) */
.testa-tabs { display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; margin:26px 0 10px; }
.testa-tabs h2 { margin:0; }
.tabs-giorni { display:flex; gap:6px; flex-wrap:wrap; }
.tab-g { font-family:var(--mono); font-weight:700; font-size:12px; border:1px solid var(--border); background:var(--white); color:var(--ink-soft); border-radius:20px; padding:7px 13px; cursor:pointer; }
.tab-g:hover { border-color:var(--ink-muted); }
.tab-g.attivo { background:var(--ink); color:var(--white); border-color:var(--ink); }
.tab-g .pallino { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-left:6px; vertical-align:1px; }
.vg { font-size:13.5px; line-height:1.4; }
.vg .vg-info { color:var(--ink-muted); font-size:13px; margin:2px 0 4px; }
.vg .sez { font-family:var(--mono); font-weight:700; font-size:10px; letter-spacing:.8px; text-transform:uppercase; color:var(--accent-dark); margin:16px 0 2px; }
.vg .es-b { padding:8px 0; border-top:1px solid var(--border); }
.vg .sez + .es-b { border-top:0; padding-top:4px; }
.vg .es-t b { font-size:14px; }
.vg .es-t .presc { color:var(--ink-muted); }
.vg .volta { display:flex; gap:10px; margin-top:6px; }
.vg .v-data { flex:0 0 48px; color:var(--ink-muted); font-size:12px; padding-top:3px; }
.vg .v-corpo { flex:1; min-width:0; }
.vg .mai { color:var(--ink-muted); font-size:12.5px; margin-top:3px; }
.chip { display:inline-block; background:var(--warm); border-radius:7px; padding:2px 7px; margin:0 3px 3px 0; font-size:12.5px; white-space:nowrap; }
.chip small { color:var(--ink-muted); font-size:11px; }
.chip.meglio { background:var(--green-light); color:var(--green); font-weight:700; }
.nota-paz { background:var(--accent-light); border-radius:8px; padding:5px 8px; margin:2px 0 3px; }
.commento { background:var(--warm-dark); border-radius:8px; padding:5px 8px; margin:3px 0; }
.commento .chi { font-weight:700; color:var(--accent-dark); }
.commento .quando { color:var(--ink-muted); font-size:11.5px; }
.commento .via { background:none; border:0; color:var(--ink-muted); cursor:pointer; font-size:13px; padding:0 2px; float:right; }
.c-form { display:flex; gap:6px; align-items:flex-start; margin-top:4px; }
.c-form textarea { font-size:13px; padding:6px 8px; min-height:34px; }
.vg .generali { margin-top:18px; }
.grafici { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.grafico { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:14px 14px 10px; position:relative; }
.grafico .titolo { font-weight:700; font-size:14px; }
.grafico .delta { font-size:13px; color:var(--ink-soft); }
.grafico svg { display:block; width:100%; height:auto; margin-top:6px; overflow:visible; }
.grafico .asse { stroke:rgba(26,26,26,.12); stroke-width:1; }
.grafico .linea { fill:none; stroke:var(--accent-dark); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.grafico .punto { fill:var(--accent-dark); stroke:var(--white); stroke-width:2; }
.grafico .bersaglio { fill:transparent; cursor:pointer; }
.grafico .etich { font-family:var(--sans); font-size:11px; fill:var(--ink-muted); }
.tooltip { position:absolute; pointer-events:none; background:var(--ink); color:var(--white); font-size:12px; border-radius:8px; padding:6px 9px; white-space:nowrap; transform:translate(-50%,-110%); display:none; z-index:5; }

/* Esercizi */
details.esercizio { background:var(--white); border:1px solid var(--border); border-radius:14px; margin-bottom:8px; }
details.esercizio summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; justify-content:space-between; gap:10px; align-items:center; }
details.esercizio summary::-webkit-details-marker { display:none; }
details.esercizio .corpo { padding:4px 16px 16px; }

.avviso { border-radius:12px; padding:12px 14px; font-size:14px; margin:14px 0; }
.avviso-info { background:var(--accent-light); border:1px solid rgba(244,121,32,0.3); }
.avviso-errore { background:rgba(192,57,43,0.08); border:1px solid rgba(192,57,43,0.3); color:var(--rosso); }
.avviso-ok { background:var(--green-light); border:1px solid rgba(46,158,91,0.3); color:#1f6e3f; }
.vuoto { color:var(--ink-muted); text-align:center; padding:22px 10px; }
.caricamento { text-align:center; color:var(--ink-muted); padding:50px 0; }
.indietro { display:inline-block; font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-muted); text-decoration:none; margin-top:18px; }
#toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--white); border-radius:12px; padding:12px 18px; font-size:14px; z-index:50; display:none; max-width:calc(100% - 32px); }
footer { height:60px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="riga">
      <a href="#pazienti" class="logo">
        <img src="/logo.png" width="671" height="135" alt="fisio·expert" class="header-logo"
             onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='inline';">
        <span id="logoFallback" class="logo-fallback">fisio<b>·</b>expert</span>
      </a>
      <span><span class="tag">Admin</span><button class="btn-esci" onclick="esci()">Esci</button></span>
    </div>
    <nav>
      <a href="#pazienti" data-tab="pazienti">Pazienti<span id="contaAttesa"></span></a>
      <a href="#nuova" data-tab="nuova">Nuova scheda</a>
      <a href="#schede" data-tab="schede">Schede</a>
      <a href="#esercizi" data-tab="esercizi">Esercizi</a>
    </nav>
  </div>
</header>

<main class="wrap" id="pagina"><div class="caricamento">Carico…</div></main>
<div id="toast"></div>
<footer></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
// ---------------------------------------------------------------------
// Configurazione
// ---------------------------------------------------------------------
const SUPABASE_URL = 'https://gaymgwkjpmrysuiltvvu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vHYG8XJx6bRHuN0zu_Zejw_IQrfZ9fl';
const FUSO = 'Europe/Rome';
const CHIAVE_BOZZA = 'fx_admin_bozza_scheda';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let mioId = null;
let pazienti = [];   // cache elenco
let esercizi = [];   // cache libreria

// ---------------------------------------------------------------------
// Utilità
// ---------------------------------------------------------------------
function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function oggiRoma() { return new Intl.DateTimeFormat('en-CA', { timeZone: FUSO }).format(new Date()); }
function dataBreve(iso) {
  if (!iso) return '';
  const [a, m, g] = iso.slice(0, 10).split('-').map(Number);
  return new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'short', year: a !== new Date().getFullYear() ? 'numeric' : undefined, timeZone: 'UTC' })
    .format(new Date(Date.UTC(a, m - 1, g, 12)));
}
function numero(n) { return Number(n).toLocaleString('it-IT', { maximumFractionDigits: 2 }); }
function nomeCompleto(p) { return `${p.nome || ''} ${p.cognome || ''}`.trim() || p.nome_utente; }
function iniziali(p) { return ((p.nome || '?')[0] + ((p.cognome || '')[0] || '')).toUpperCase(); }
function toast(testo) {
  const t = $('toast'); t.textContent = testo; t.style.display = 'block';
  clearTimeout(t._timer); t._timer = setTimeout(() => t.style.display = 'none', 3200);
}
function errore(err, prefisso = 'Errore') {
  console.error(err);
  const m = err?.message || String(err);
  toast(`${prefisso}: ${m.includes('Failed to fetch') ? 'connessione assente' : m}`);
}
function attesa(btn, attivo, testo) {
  if (!btn) return;
  if (attivo) { btn.dataset.testo = btn.textContent; btn.textContent = testo || 'Attendi…'; btn.disabled = true; }
  else { btn.textContent = btn.dataset.testo || btn.textContent; btn.disabled = false; }
}

// ---------------------------------------------------------------------
// Avvio e navigazione
// ---------------------------------------------------------------------
async function avvio() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return location.replace('/login.html');
  mioId = session.user.id;
  const { data: io } = await sb.from('profili').select('ruolo').eq('id', mioId).single();
  if (io?.ruolo !== 'admin') return location.replace('/app.html');
  window.addEventListener('hashchange', instrada);
  aggiornaContaAttesa();
  instrada();
}

function instrada() {
  const [tab, id] = (location.hash.slice(1) || 'pazienti').split('/');
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('attiva', a.dataset.tab === (tab === 'paziente' || tab === 'risultati' ? 'pazienti' : tab)));
  window.scrollTo(0, 0);
  $('pagina').innerHTML = '<div class="caricamento">Carico…</div>';
  ({ pazienti: vistaPazienti, paziente: () => vistaPaziente(id), nuova: () => vistaNuova(id),
     risultati: () => vistaRisultati(id), schede: vistaSchede, esercizi: vistaEsercizi }[tab] || vistaPazienti)();
}

async function aggiornaContaAttesa() {
  const { count } = await sb.from('profili').select('id', { count: 'exact', head: true }).eq('ruolo', 'paziente').eq('attivo', false);
  $('contaAttesa').innerHTML = count ? `<span class="conta">${count}</span>` : '';
}

async function esci() { await sb.auth.signOut(); location.replace('/login.html'); }

// =====================================================================
// PAZIENTI
// =====================================================================
async function vistaPazienti() {
  const [{ data: elenco, error }, { data: ultime }] = await Promise.all([
    sb.from('profili').select('*').eq('ruolo', 'paziente').order('creato_il', { ascending: false }),
    sb.from('sessioni').select('paziente_id, data').eq('completata', true).order('data', { ascending: false }).limit(1000)
  ]);
  if (error) return errore(error, 'Pazienti non caricati');
  pazienti = elenco;
  const ultimaDi = {};
  (ultime || []).forEach(s => { ultimaDi[s.paziente_id] ||= s.data; });

  const inAttesa = elenco.filter(p => !p.attivo);
  let html = `<h1>Pazienti</h1>
    <p class="sotto">${elenco.length} ${elenco.length === 1 ? 'paziente registrato' : 'pazienti registrati'}${inAttesa.length ? ` · <b>${inAttesa.length} da attivare</b>` : ''}</p>
    <input class="cerca" id="cercaPaz" placeholder="Cerca per nome, nome utente o email…" oninput="filtraPazienti()">
    <div id="elencoPaz"></div>`;
  $('pagina').innerHTML = html;
  window._ultimaDi = ultimaDi;
  filtraPazienti();
}

function filtraPazienti() {
  const q = ($('cercaPaz')?.value || '').toLowerCase().trim();
  const lista = pazienti
    .filter(p => !q || [p.nome, p.cognome, p.nome_utente, p.email].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (a.attivo - b.attivo) || nomeCompleto(a).localeCompare(nomeCompleto(b), 'it'));
  if (!lista.length) { $('elencoPaz').innerHTML = `<div class="card vuoto">${pazienti.length ? 'Nessun risultato.' : 'Nessun paziente registrato. Manda ai pazienti il link fisioexpert.it/login.html'}</div>`; return; }
  $('elencoPaz').innerHTML = lista.map(p => {
    const ultima = window._ultimaDi[p.id];
    return `
      <a class="card paziente" href="#paziente/${p.id}">
        <span class="iniziali">${esc(iniziali(p))}</span>
        <span class="testo">
          <span class="nome">${esc(nomeCompleto(p))}</span>

        </span>
        ${p.attivo ? '<span class="badge ok">Attivo</span>' : '<span class="badge attesa">Da attivare</span>'}
      </a>`;
  }).join('');
}

      .eq('paziente_id', id).order('data_inizio', { ascending: false }),
    sb.from('sessioni').select(`id, giorno, data, completata, note, note_esercizi, assegnazione_id,

          <span class="badge ok">Attiva</span>

  if (a0) avviaVistaGiorni(a0, sessioni.filter(s => s.assegnazione_id === a0.id), commenti, 3);

function storicoAdmin(sessioni, nomeRiga = {}, nomeScheda = {}) {
  if (!sessioni.length) return `<div class="card vuoto">Nessun allenamento registrato.</div>`;
  return sessioni.map(s => {
    const perEs = new Map();
    (s.serie_registrate || []).slice()
      .sort((a, b) => (a.scheda_esercizi?.ordine ?? 0) - (b.scheda_esercizi?.ordine ?? 0) || a.numero_serie - b.numero_serie)
      .forEach(r => {
        const n = r.scheda_esercizi?.esercizi?.nome || 'Esercizio';
        if (!perEs.has(n)) perEs.set(n, []);
        perEs.get(n).push(r);
      });
    const noteEs = { ...(s.note_esercizi || {}) };
    let corpo = '';
    perEs.forEach((serie, nome) => {
      const riga = serie[0].scheda_esercizio_id;
      corpo += `<div class="es"><b>${esc(nome)}</b>: ${serie.map(r =>
        `${r.ripetizioni ?? '–'}${Number(r.carico_kg) > 0 ? '×' + numero(r.carico_kg) + 'kg' : ''}${r.rpe != null ? ' @' + numero(r.rpe) : ''}`).join(' · ')}
        ${noteEs[riga] ? `<div class="nota">💬 ${esc(noteEs[riga])}</div>` : ''}</div>`;
      delete noteEs[riga];
    });
    // note su esercizi di cui non ha segnato serie
    Object.entries(noteEs).forEach(([riga, testo]) => {
      if (testo) corpo += `<div class="es"><b>${esc(nomeRiga[riga] || 'Esercizio')}</b><div class="nota">💬 ${esc(testo)}</div></div>`;
    });
    if (!corpo) corpo = '<div class="es">Nessuna serie registrata.</div>';
    if (s.note) corpo += `<div class="nota"><b>Nota generale:</b> ${esc(s.note)}</div>`;
    return `
      <details class="sessione" data-assegnazione="${s.assegnazione_id}">
        <summary>
          <span><b>${dataBreve(s.data)}</b> · Giorno ${s.giorno} · ${(s.serie_registrate || []).length} serie
            ${nomeScheda[s.assegnazione_id] ? `<span style="color:var(--ink-muted);font-size:13px;display:block">${esc(nomeScheda[s.assegnazione_id])}</span>` : ''}
            ${s.note || Object.values(s.note_esercizi || {}).some(Boolean) ? '<span class="nota-flag">· nota</span>' : ''}</span>
          ${s.completata ? '<span class="badge ok">Completato</span>' : '<span class="badge spento">Non finito</span>'}
        </summary>
        <div class="corpo">${corpo}</div>
      </details>`;
  }).join('');
}

// Un grafico per esercizio: carico massimo per allenamento (o ripetizioni massime se a corpo libero)
function disegnaGrafici(sessioni) {
  const serieEs = new Map(); // nome → [{data, valore}]
  sessioni.filter(s => s.completata).slice().reverse().forEach(s => {
    const massimi = new Map();
    (s.serie_registrate || []).forEach(r => {
      const n = r.scheda_esercizi?.esercizi?.nome; if (!n) return;
      const m = massimi.get(n) || { kg: 0, rip: 0 };
      m.kg = Math.max(m.kg, Number(r.carico_kg) || 0);
      m.rip = Math.max(m.rip, Number(r.ripetizioni) || 0);
      massimi.set(n, m);
    });
    massimi.forEach((m, n) => {
      if (!serieEs.has(n)) serieEs.set(n, []);
      serieEs.get(n).push({ data: s.data, kg: m.kg, rip: m.rip });
    });
  });

  const grafici = [];
  serieEs.forEach((punti, nome) => {
    if (punti.length < 2) return;
    const usaKg = punti.some(p => p.kg > 0);
    const valori = punti.map(p => ({ data: p.data, v: usaKg ? p.kg : p.rip })).filter(p => p.v > 0);
    if (valori.length < 2) return;
    grafici.push({ nome, unita: usaKg ? 'kg' : 'rip', valori });
  });
  if (!grafici.length) { $('grafici').innerHTML = `<div class="card vuoto">I grafici compaiono dopo almeno due allenamenti con lo stesso esercizio.</div>`; return; }

  const L = 300, H = 110, sx = 8, dx = 8, su = 14, giu = 20;
  $('grafici').innerHTML = `<div class="grafici">${grafici.map((g, gi) => {
    const vs = g.valori.map(p => p.v);
    let min = Math.min(...vs), max = Math.max(...vs);
    if (min === max) { min = Math.max(0, min - 1); max = max + 1; }
    const x = i => sx + (L - sx - dx) * (g.valori.length === 1 ? 0.5 : i / (g.valori.length - 1));
    const y = v => su + (H - su - giu) * (1 - (v - min) / (max - min));
    const primo = g.valori[0].v, ultimo = g.valori[g.valori.length - 1].v;
    const diff = ultimo - primo;
    const percorso = g.valori.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    return `
      <div class="grafico" data-g="${gi}">
        <div class="titolo">${esc(g.nome)}</div>
        <div class="delta">${numero(primo)} → <b>${numero(ultimo)} ${g.unita}</b> ${diff ? `(${diff > 0 ? '+' : ''}${numero(diff)})` : ''} · ${g.valori.length} allenamenti</div>
        <svg viewBox="0 0 ${L} ${H}" role="img" aria-label="${esc(g.nome)}: da ${numero(primo)} a ${numero(ultimo)} ${g.unita}">
          <line class="asse" x1="${sx}" x2="${L - dx}" y1="${H - giu}" y2="${H - giu}"/>
          <path class="linea" d="${percorso}"/>
          ${g.valori.map((p, i) => `<circle class="punto" cx="${x(i)}" cy="${y(p.v)}" r="4"/>`).join('')}
          ${g.valori.map((p, i) => `<circle class="bersaglio" cx="${x(i)}" cy="${y(p.v)}" r="12" data-testo="${esc(dataBreve(p.data))}: ${numero(p.v)} ${g.unita}"/>`).join('')}
          <text class="etich" x="${sx}" y="${H - 4}">${esc(dataBreve(g.valori[0].data))}</text>
          <text class="etich" x="${L - dx}" y="${H - 4}" text-anchor="end">${esc(dataBreve(g.valori[g.valori.length - 1].data))}</text>
        </svg>
        <div class="tooltip"></div>
      </div>`;
  }).join('')}</div>`;

  document.querySelectorAll('.grafico .bersaglio').forEach(c => {
    const box = c.closest('.grafico'), tip = box.querySelector('.tooltip');
    const mostra = () => {
      const r = c.getBoundingClientRect(), b = box.getBoundingClientRect();
      tip.textContent = c.dataset.testo; tip.style.display = 'block';
      tip.style.left = (r.left + r.width / 2 - b.left) + 'px'; tip.style.top = (r.top - b.top + 6) + 'px';
    };
    c.addEventListener('mouseenter', mostra); c.addEventListener('click', mostra);
    c.addEventListener('mouseleave', () => tip.style.display = 'none');
  });
}

// Azioni sul paziente
// ---------------------------------------------------------------------
async function impostaAttivo(id, attivo, btn) {
  attesa(btn, true);
  const { error } = await sb.from('profili').update({ attivo }).eq('id', id);
  attesa(btn, false);
  if (error) return errore(error);
  toast(attivo ? 'Paziente attivato' : 'Paziente disattivato');
  aggiornaContaAttesa(); vistaPaziente(id);
}

async function salvaDatiPaziente(e, id) {
  e.preventDefault();
  const f = new FormData(e.target);
  const dati = {};
  ['nome', 'cognome', 'email', 'telefono', 'crm_id'].forEach(k => dati[k] = (f.get(k) || '').trim() || (k === 'nome' || k === 'cognome' ? '' : null));
  if (dati.email) dati.email = dati.email.toLowerCase();
  const { error } = await sb.from('profili').update(dati).eq('id', id);
  if (error) return errore(error);
  toast('Dati salvati');
}

// Una scheda con, sotto ogni esercizio, quello che il paziente ha fatto in ogni allenamento

async function vistaRisultati(assegnazioneId) {
  const [r1, r2] = await Promise.all([
    sb.from('assegnazioni').select(`id, stato, data_inizio, data_fine, paziente_id, scheda_id,
        profili ( nome, cognome ),
        schede ( nome, indicazioni, scheda_esercizi ( id, giorno, ordine, sezione, serie, ripetizioni, carico, rpe, recupero, esercizi ( nome ) ) )`)
      .eq('id', assegnazioneId).single(),
    sb.from('sessioni').select(`id, giorno, data, completata, note, note_esercizi,
        serie_registrate ( scheda_esercizio_id, numero_serie, ripetizioni, carico_kg, rpe )`)
      .eq('assegnazione_id', assegnazioneId).order('data', { ascending: false }).order('creato_il', { ascending: false })
  ]);
  const commenti = await caricaCommenti('assegnazione_id', assegnazioneId);
  if (r1.error) return errore(r1.error, 'Scheda non trovata');
  if (r2.error) return errore(r2.error, 'Allenamenti non caricati');

  const paziente = `${a.profili?.nome || ''} ${a.profili?.cognome || ''}`.trim();

  let html = `
    <a class="indietro" href="#paziente/${a.paziente_id}">← ${esc(paziente || 'Paziente')}</a>
    <h1>${esc(a.schede?.nome)}</h1>
    <p class="sotto">${esc(paziente)} · dal ${dataBreve(a.data_inizio)}${a.data_fine ? ' al ' + dataBreve(a.data_fine) : ''} ·
      ${completate} ${completate === 1 ? 'allenamento completato' : 'allenamenti completati'}
      ${a.stato === 'attiva' ? '<span class="badge ok">Attiva</span>' : '<span class="badge spento">Conclusa</span>'}</p>
    ${a.schede?.indicazioni ? `<div class="avviso avviso-info" style="white-space:pre-line">${esc(a.schede.indicazioni)}</div>` : ''}
    <div class="azioni" style="margin-bottom:6px">
      <button class="btn btn-sec btn-piccolo" onclick="modelloDaScheda('${a.scheda_id}', '${a.paziente_id}')">Usa come modello per la progressione</button>
    </div>
    <div class="testa-tabs"><div class="tabs-giorni" id="tabsGiorni"></div></div>
    <div class="card"><div id="vistaGiorno"></div></div>`;

// ---------------------------------------------------------------------
// Vista per giorni: un giorno alla volta, per ogni esercizio cosa ha fatto
// il paziente, le sue note e i commenti di Gianmarco (che lui vede nell'app)
// ---------------------------------------------------------------------
let vg = null;

async function caricaCommenti(campo, valore) {
  const { data, error } = await sb.from('commenti')
    .select('id, sessione_id, scheda_esercizio_id, testo, creato_il, sessioni!inner ( paziente_id, assegnazione_id )')
    .eq('sessioni.' + campo, valore).order('creato_il');
  if (error) { console.warn('Commenti non disponibili:', error.message); return null; } // tabella non ancora creata
  return data || [];
}

// sessioni: quelle di questa assegnazione, dalla più recente. limite: quante volte mostrare per esercizio (0 = tutte)
function avviaVistaGiorni(a, sessioni, commenti, limite) {
  const righe = (a.schede?.scheda_esercizi || []).slice().sort((x, y) => x.giorno - y.giorno || x.ordine - y.ordine);
  const giorni = [...new Set(righe.map(r => r.giorno))];
  const giorno = giorni.includes(sessioni[0]?.giorno) ? sessioni[0].giorno : giorni[0]; // parte dall'ultimo allenamento fatto
  vg = { righe, giorni, sessioni, commenti: commenti || [], senzaCommenti: commenti === null, giorno, limite };
  disegnaVistaGiorni();
}

function scegliGiorno(g) { vg.giorno = g; disegnaVistaGiorni(); }

function testoSerie(x) {
  const kg = Number(x.carico_kg) || 0;
  let t = x.ripetizioni != null ? String(x.ripetizioni) : '';
  if (kg) t += (t ? ' × ' : '') + numero(kg) + ' kg';
  return esc(t || '✓') + (x.rpe != null ? ` <small>RPE ${numero(x.rpe)}</small>` : '');
}

function htmlCommenti(lista) {
  return lista.map(c => `
    <div class="commento"><button class="via" title="Elimina commento" onclick="eliminaCommento('${c.id}')">✕</button>
      <span class="chi">Gianmarco</span> <span class="quando">${dataBreve(c.creato_il)}</span><br>${esc(c.testo).replace(/\n/g, '<br>')}</div>`).join('');
}
function bottoneCommento(sid, rid) {
  return vg.senzaCommenti ? '' : `<button class="link" onclick="apriCommento(this, '${sid}', '${rid}')">Commenta</button>`;
}

function disegnaVistaGiorni() {
  const { righe, giorni, sessioni, commenti, giorno, limite } = vg;
  const sess = sessioni.filter(s => s.giorno === giorno);
  const commentiDi = (sid, rid) => commenti.filter(c => c.sessione_id === sid && (c.scheda_esercizio_id || '') === rid);

  // pallino arancione: il paziente ha scritto una nota a cui non hai ancora risposto
  const daRispondere = g => sessioni.some(s => s.giorno === g && (
    (s.note && !commentiDi(s.id, '').length) ||
    Object.entries(s.note_esercizi || {}).some(([rid, t]) => t && !commentiDi(s.id, rid).length)));
  $('tabsGiorni').innerHTML = giorni.map(g =>
    `<button class="tab-g${g === giorno ? ' attivo' : ''}" onclick="scegliGiorno(${g})">Giorno ${g}${!vg.senzaCommenti && daRispondere(g) ? '<span class="pallino" title="Note da leggere"></span>' : ''}</button>`).join('');

  const fatte = sess.filter(s => s.completata);
  let html = `<div class="vg"><div class="vg-info">${fatte.length
    ? `Giorno ${giorno} fatto ${fatte.length} ${fatte.length === 1 ? 'volta' : 'volte'} · l'ultima il ${dataBreve(fatte[0].data)}`
    : `Giorno ${giorno} non ancora fatto`}</div>`;
  if (vg.senzaCommenti) html += `<div class="avviso avviso-info">Per scrivere commenti al paziente esegui una volta <b>supabase/05-commenti.sql</b> nel SQL Editor di Supabase.</div>`;

  let sezione = null;
  righe.filter(r => r.giorno === giorno).forEach(r => {
    if ((r.sezione || '') !== sezione) { sezione = r.sezione || ''; if (sezione) html += `<div class="sez">${esc(sezione)}</div>`; }
    const presc = [r.serie ? `${r.serie}×${r.ripetizioni || '–'}` : r.ripetizioni, r.carico, r.rpe ? (/^\d/.test(r.rpe) ? 'RPE ' : '') + r.rpe : '', r.recupero ? 'rec ' + r.recupero : '']
      .filter(Boolean).map(esc).join(' · ');
    const volte = sess.map(s => ({
      s, serie: (s.serie_registrate || []).filter(x => x.scheda_esercizio_id === r.id).sort((x, y) => x.numero_serie - y.numero_serie),
      nota: (s.note_esercizi || {})[r.id], comm: commentiDi(s.id, r.id)
    })).filter(v => v.serie.length || v.nota || v.comm.length);
    const maxKg = Math.max(0, ...volte.flatMap(v => v.serie.map(x => Number(x.carico_kg) || 0)));
    const mostrate = limite ? volte.slice(0, limite) : volte;
    html += `
      <div class="es-b">
        <div class="es-t"><b>${esc(r.esercizi?.nome)}</b>${presc ? `<span class="presc"> · ${presc}</span>` : ''}</div>
        ${mostrate.map(v => `
          <div class="volta"><span class="v-data">${dataBreve(v.s.data)}</span><div class="v-corpo">
            ${v.serie.map(x => { const kg = Number(x.carico_kg) || 0;
              return `<span class="chip${kg && kg === maxKg && volte.length > 1 ? ' meglio' : ''}">${testoSerie(x)}</span>`; }).join('')}
            ${v.nota ? `<div class="nota-paz">💬 ${esc(v.nota)}</div>` : ''}
            ${htmlCommenti(v.comm)}${bottoneCommento(v.s.id, r.id)}
          </div></div>`).join('') || '<div class="mai">Non ancora fatto</div>'}
        ${volte.length > mostrate.length ? `<div class="mai">+ altre ${volte.length - mostrate.length} volte in "Tutti i risultati"</div>` : ''}
      </div>`;
  });

  // note generali dell'allenamento + commenti generali
  const generali = sess.filter(s => s.note || commentiDi(s.id, '').length);
  const conNota = limite ? generali.slice(0, limite) : generali;
  if (conNota.length) html += `<div class="generali"><div class="sez">Note sull'allenamento</div>${conNota.map(s => `
      <div class="volta"><span class="v-data">${dataBreve(s.data)}</span><div class="v-corpo">
        ${s.note ? `<div class="nota-paz">💬 ${esc(s.note)}</div>` : ''}${htmlCommenti(commentiDi(s.id, ''))}${bottoneCommento(s.id, '')}
      </div></div>`).join('')}</div>`;
  if (fatte.length && !vg.senzaCommenti) html += `<div style="margin-top:10px"><button class="link" onclick="apriCommento(this, '${fatte[0].id}', '')">+ Commento generale sull'ultimo Giorno ${giorno}</button></div>`;

  $('vistaGiorno').innerHTML = html + '</div>';
}

  const f = document.createElement('div');

}

// Lettore del testo libero
// ---------------------------------------------------------------------
function leggiSchedaDaTesto(testo) {
  const ris = { indicazioni: [], righe: [] };
  let giorno = null, ultima = null, sezione = '';

  testo.split(/\r?\n/).forEach(grezza => {
    let riga = grezza.trim();
    if (!riga) return;

    // "Giorno 2", "G2", "Day 2", "GIORNO 2 - gambe"
    const g = riga.match(/^(?:giorno|day|g)\s*(\d{1,2})\b/i);
    if (g) { giorno = Number(g[1]); ultima = null; sezione = ''; return; }

    // "Sezione: Lavoro principale", "## Accessori" o una riga tutta maiuscola: "RISCALDAMENTO"
    const sez = riga.match(/^(?:sezione\s*:\s*|#{1,3}\s*)(.+)$/i) ||
      (/^[A-ZÀ-Ý][A-ZÀ-Ý\s·+\-–()/]{3,}$/.test(riga) && !/\d/.test(riga) ? [riga, riga] : null);
    if (sez) { const t = sez[1].trim().replace(/:$/, ''); sezione = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase(); ultima = null; return; }

    // Indicazioni generali (prima del primo giorno o con "Indicazioni:")
    const ind = riga.match(/^indicazioni(?:\s+generali)?\s*:\s*(.*)$/i);
    if (ind) { ris.indicazioni.push(ind[1]); return; }

    // "> testo" o "→ testo": indicazioni dell'esercizio sopra
    if (/^[>→]/.test(riga) && ultima) { ultima.indicazioni = [ultima.indicazioni, riga.replace(/^[>→]\s*/, '')].filter(Boolean).join(' '); return; }
    // "nota: …" da sola: nota dell'esercizio sopra
    const notaSola = riga.match(/^not[ae]\s*:\s*(.+)$/i);
    if (notaSola && ultima) { ultima.note = [ultima.note, notaSola[1]].filter(Boolean).join(' '); return; }

    // toglie punti elenco e numerazione: "- ", "• ", "1. ", "1) "
    riga = riga.replace(/^(?:[-•*·]\s+|\d{1,2}[.)]\s+)/, '');

    let es = leggiRigaEsercizio(riga);
    if (!es && giorno === null) { ris.indicazioni.push(riga); return; }
    // dentro un giorno, una riga non riconosciuta diventa comunque un esercizio (si corregge in tabella)
    if (!es) es = { nome: riga.charAt(0).toUpperCase() + riga.slice(1), serie: null, ripetizioni: '', carico: '', rpe: '', recupero: '', indicazioni: '', note: '' };
    if (giorno === null) giorno = 1;
    es.giorno = giorno;
    es.sezione = sezione;
    ris.righe.push(es);
    ultima = es;
  });
  ris.indicazioni = ris.indicazioni.join('\n');
  return ris;
}

// "Squat bulgaro 3x8-10 RPE 7 rec 90" - scendi lento nota: occhio al ginocchio"
function leggiRigaEsercizio(riga) {
  let resto = riga, note = '', rpe = '', recupero = '', serie = null, ripetizioni = '', carico = '';

  const n = resto.match(/\bnot[ae]\s*:\s*(.+)$/i);
  if (n) { note = n[1].trim(); resto = resto.slice(0, n.index); }

  const r = resto.match(/\brpe\s*:?\s*(\d+(?:[.,]\d)?(?:\s*[-–\/]\s*\d+(?:[.,]\d)?)?)/i);
  if (r) { rpe = r[1].replace(/\s+/g, '').replace('–', '-'); resto = resto.replace(r[0], ' '); }

  const rec = resto.match(/\b(?:rec(?:upero)?|riposo|pausa)\s*:?\s*(\d+(?:[.,]\d+)?\s*(?:['’]\s*\d*\s*["”]?|["”]|sec(?:ondi)?\b|s\b|min(?:uti)?\b|m\b)?)/i);
  if (rec) { recupero = rec[1].trim(); resto = resto.replace(rec[0], ' '); }

  // "carico 60 kg" ovunque; un "60 kg" da solo solo prima delle indicazioni (" - …"), dove "manubrio da 8 kg" non c'entra
  const car = resto.match(/\b(?:carico|peso)\s*:?\s*(\d+(?:[.,]\d+)?\s*kg)\b/i);
  const testa = resto.split(/\s[-–]\s/)[0];
  const kg = car || testa.match(/(\d+(?:[.,]\d+)?\s*kg)\b/i);
  if (kg) { carico = kg[1].replace(/\s*kg$/i, ' kg'); resto = resto.replace(kg[0], ' '); }

  // 3x10 · 3 x 8-10 · 3x30 sec · 3xmax · 3 serie da 10
  const sr = resto.match(/(\d{1,2})\s*(?:[x×*]|serie\s*(?:da|x)?)\s*(max|\d+(?:\s*[-–]\s*\d+)?(?:\s*(?:sec(?:ondi)?|s|["”]|min(?:uti)?|['’]|rip(?:etizioni)?|per\s+lato|x\s*lato))?)\b["”'’]?/i);
  let nome = resto, dopo = '';
  if (sr) {
    serie = Number(sr[1]);
    ripetizioni = sr[2].replace(/\s*rip(?:etizioni)?$/i, '').replace(/\s+/g, ' ').replace('–', '-').trim();
    if (/["”]$/.test(sr[0]) && !/sec|["”]/.test(ripetizioni)) ripetizioni += ' sec';
    ripetizioni = ripetizioni.replace(/\s*["”]$/, ' sec').replace(/\bs$/, 'sec');
    nome = resto.slice(0, sr.index);
    dopo = resto.slice(sr.index + sr[0].length);
  } else {
    // senza serie×rip: è un esercizio solo se ha RPE o recupero, oppure un separatore " - "
    const sep = resto.match(/\s[-–:]\s/);
    if (!rpe && !recupero && !carico && !sep) return null;
    if (sep) { nome = resto.slice(0, sep.index); dopo = resto.slice(sep.index + sep[0].length); }
  }
  nome = nome.replace(/[\s\-–:,|]+$/, '').trim();
  const indicazioni = dopo.replace(/^[\s\-–:,|]+/, '').replace(/\s{2,}/g, ' ').trim();
  if (!nome) return null;
  return { nome: nome.charAt(0).toUpperCase() + nome.slice(1), serie, ripetizioni, carico, rpe, recupero, indicazioni, note };
}

// Formato preciso preparato da Claude in chat: { nome, indicazioni, giorni: [{ giorno, esercizi: [...] }] }
function leggiSchedaDaJson(testo) {
  // accetta la scheda intera { giorni: [...] }, un solo giorno { esercizi: [...] } o un elenco [ {esercizio}, … ]
  const graffa = testo.indexOf('{'), quadra = testo.indexOf('[');
  const elenco = quadra >= 0 && (graffa < 0 || quadra < graffa);
  const inizio = elenco ? quadra : graffa, fine = testo.lastIndexOf(elenco ? ']' : '}');
  if (inizio < 0 || fine < inizio) return null;
  let dati;
  try { dati = JSON.parse(testo.slice(inizio, fine + 1)); } catch { return null; }
  let giorni;
  if (Array.isArray(dati)) giorni = dati.some(x => Array.isArray(x?.esercizi)) ? dati : [{ giorno: 1, esercizi: dati }];
  else if (Array.isArray(dati?.giorni)) giorni = dati.giorni;
  else if (Array.isArray(dati?.esercizi)) giorni = [{ giorno: dati.giorno || 1, esercizi: dati.esercizi }];
  else return null;
  dati = Array.isArray(dati) ? {} : dati;
  const testoDi = v => v == null ? '' : String(v).trim();
  const righe = [];
  giorni.forEach((g, gi) => (g.esercizi || []).forEach(e => {
    if (!testoDi(e.nome)) return;
    righe.push({
      giorno: Number(e.giorno) || Number(g.giorno) || gi + 1,
      nome: testoDi(e.nome),
      serie: parseInt(e.serie, 10) || null,
      ripetizioni: testoDi(e.ripetizioni),
      carico: testoDi(e.carico),
      sezione: testoDi(e.sezione),
      rpe: testoDi(e.rpe),
      recupero: testoDi(e.recupero),
      indicazioni: testoDi(e.indicazioni),
      note: testoDi(e.note)
    });
  }));
  return { nome: testoDi(dati.nome), indicazioni: testoDi(dati.indicazioni), righe };
}

function leggiTesto() {
  bozza.testo = $('testoScheda').value;
  const json = leggiSchedaDaJson(bozza.testo);
  // sembra il blocco di Claude ma non si legge: meglio fermarsi che creare righe sbagliate
  if (!json && /"(?:giorni|esercizi|serie|ripetizioni)"\s*:/.test(bozza.testo))
    return toast('Il blocco VERSIONE APP non è completo o è stato modificato. Ricopialo intero dalla risposta di Claude.');
  if (json && json.nome && !$('nomeScheda').value.trim()) { $('nomeScheda').value = json.nome; bozza.nome = json.nome; }
  const ris = json || leggiSchedaDaTesto(bozza.testo);
  if (!ris.righe.length) return toast('Non ho trovato esercizi. Controlla l\'esempio: es. "Squat 3x10 RPE 7"');
  bozza.righe = ris.righe;
  bozza.indicazioni = ris.indicazioni;
  salvaBozza(); disegnaAnteprima();
  $('anteprima').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

  let corpo = '', g = null;

    corpo += `
      <div class="riga-es" data-i="${i}">

          <div class="f largo" data-label="Esercizio"><input data-c="nome" list="nomiEsercizi" value="${esc(r.nome)}" title="${esc(r.nome)}">
            ${r.ultimo ? `<div class="ultimo">Fatto: <b>${esc(r.ultimo.testo)}</b></div>` : ''}</div>
          <div class="f" data-label="Serie"><input data-c="serie" inputmode="numeric" value="${r.serie ?? ''}"></div>
          <div class="f" data-label="RPE"><input data-c="rpe" value="${esc(r.rpe)}"></div>
          <div class="f" data-label="Recupero"><input data-c="recupero" value="${esc(r.recupero)}"></div>
          <div class="riga-tools">
            <button type="button" title="Su" data-az="su">↑</button>
            <button type="button" title="Giù" data-az="giu">↓</button>
            <button type="button" title="Elimina" data-az="via">✕</button>
          </div>
        </div>
        <div class="l2">
          <div class="f" data-label="G"><input data-c="giorno" inputmode="numeric" value="${r.giorno}"></div>
          <div class="f" data-label="Ripetizioni"><textarea data-c="ripetizioni" rows="1">${esc(r.ripetizioni)}</textarea></div>
          <div class="f" data-label="Carico"><textarea data-c="carico" rows="1">${esc(r.carico)}</textarea></div>
          <div class="f largo" data-label="Indicazioni"><textarea data-c="indicazioni" rows="1">${esc(r.indicazioni)}</textarea></div>
          <div class="f largo" data-label="Note"><textarea data-c="note" rows="1">${esc(r.note)}</textarea></div>
        </div>
      </div>`;
  });

  const giorni = new Set(bozza.righe.map(r => r.giorno)).size;
  $('anteprima').innerHTML = `
    <h2>Controlla e correggi</h2>
    <div class="card">
      <label class="etichetta" for="indicazioniScheda">Indicazioni generali</label>
      <textarea id="indicazioniScheda" rows="2" placeholder="Valgono per tutta la scheda">${esc(bozza.indicazioni)}</textarea>
    </div>
    ${disegnaProgressione()}
    <div class="card">
      <div class="righe-ed" id="corpoRighe">${corpo}</div>
      <button type="button" class="link" onclick="aggiungiRiga()">+ Aggiungi esercizio</button>
    </div>
    ${nuovi.length ? `<div class="avviso avviso-info"><b>Esercizi nuovi</b> (verranno aggiunti alla libreria): ${nuovi.map(esc).join(', ')}.
      Se uno è già in libreria con un nome diverso, correggilo scegliendolo dal suggerimento.</div>` : ''}
    <div class="avviso avviso-info" id="riepilogoSalva">${bozza.righe.length} esercizi su ${giorni} ${giorni === 1 ? 'giorno' : 'giorni'}.</div>
    <button class="btn btn-largo" id="btnSalvaScheda" onclick="salvaScheda(this)">Salva scheda${bozza.pazienteId ? ' e assegna' : ''}</button>`;

  $('indicazioniScheda').addEventListener('input', e => { bozza.indicazioni = e.target.value; salvaBozza(); });
  $('corpoRighe').querySelectorAll('textarea').forEach(adatta);
  $('corpoRighe').addEventListener('input', e => {
    const c = e.target.dataset.c; if (!c) return;
    if (e.target.tagName === 'TEXTAREA') adatta(e.target);
    const r = bozza.righe[Number(e.target.closest('.riga-es').dataset.i)];

    salvaBozza(); disegnaAnteprima();
  });
}

// ---------------------------------------------------------------------
// Progressione: riparte dalla scheda precedente e aumenta i carichi
// ---------------------------------------------------------------------
// "60 kg" → 60 ; "60" → 60 ; "max 123 kg" → null
function caricoNumero(testo) {
  const m = String(testo || '').trim().match(/^(\d+(?:[.,]\d+)?)\s*(?:kg)?$/i);
  return m ? Number(m[1].replace(',', '.')) : null;
}

function disegnaProgressione() {
  const conFatto = bozza.righe.filter(r => r.ultimo).length;
  const numerici = bozza.righe.filter(r => caricoNumero(r.carico) != null).length;
  if (!conFatto && !numerici) return '';
  return `
    <div class="card progressione">
      <b>Progressione dei carichi</b>
      <div style="font-size:14px;color:var(--ink-soft);margin-top:4px">
        ${conFatto ? `Sotto ogni esercizio vedi in verde cosa ha fatto il paziente l'ultima volta (${conFatto} esercizi). ` : ''}
        Scegli da dove partire e di quanto aumentare: cambia solo i carichi scritti come numero (es. "60 kg"). Poi correggi a mano quelli che vuoi.</div>
      <div class="comandi">
        <div><label class="etichetta" for="progBase">Parti da</label>
          <select id="progBase">
            <option value="scheda">carico della scheda</option>
            ${conFatto ? '<option value="fatto">carico fatto l\'ultima volta</option>' : ''}
          </select></div>
        <div><label class="etichetta" for="progValore">Aumenta di</label>
          <input id="progValore" inputmode="decimal" value="2,5"></div>
        <div><label class="etichetta" for="progUnita">&nbsp;</label>
          <select id="progUnita"><option value="kg">kg</option><option value="%">%</option></select></div>
        <button type="button" class="btn btn-piccolo" onclick="applicaProgressione()">Applica</button>
      </div>
    </div>`;
}

function applicaProgressione() {
  const base = $('progBase').value, unita = $('progUnita').value;
  const valore = parseFloat(($('progValore').value || '').replace(',', '.'));
  if (!Number.isFinite(valore)) return toast('Scrivi di quanto aumentare, es. 2,5');
  let cambiati = 0;
  bozza.righe.forEach(r => {
    const partenza = base === 'fatto' ? (r.ultimo?.kg || null) : caricoNumero(r.caricoScheda ?? r.carico);
    if (!partenza) return;
    const nuovo = unita === '%' ? partenza * (1 + valore / 100) : partenza + valore;
    r.carico = (Math.round(nuovo * 2) / 2).toLocaleString('it-IT', { maximumFractionDigits: 1 }) + ' kg'; // al mezzo kg
    cambiati++;
  });
  salvaBozza(); disegnaAnteprima();
  toast(cambiati ? `Aggiornati ${cambiati} carichi. Controlla la tabella prima di salvare.` : 'Nessun carico numerico da aumentare');
}

// Per ogni esercizio: le serie dell'ultimo allenamento in cui il paziente l'ha fatto (in qualsiasi scheda)
async function ultimeEsecuzioni(eserciziIds, pazienteId) {
  eserciziIds = [...new Set(eserciziIds.filter(Boolean))];
  if (!eserciziIds.length || !pazienteId) return {};
  const { data, error } = await sb.from('serie_registrate')
    .select('sessione_id, numero_serie, ripetizioni, carico_kg, rpe, creato_il, sessioni!inner ( data, paziente_id ), scheda_esercizi!inner ( esercizio_id )')
    .in('scheda_esercizi.esercizio_id', eserciziIds).eq('sessioni.paziente_id', pazienteId)
    .order('creato_il', { ascending: false }).limit(1000);
  if (error) { console.error(error); return {}; }
  const perRiga = {}, sessioneDi = {};
  data.forEach(r => {
    const es = r.scheda_esercizi.esercizio_id;
    sessioneDi[es] ||= r.sessione_id;
    if (r.sessione_id === sessioneDi[es]) (perRiga[es] ||= []).push(r);
  });
  const ris = {};
  Object.entries(perRiga).forEach(([id, serie]) => {
    serie.sort((a, b) => a.numero_serie - b.numero_serie);
    const kg = Math.max(0, ...serie.map(x => Number(x.carico_kg) || 0));
    const rpe = serie.map(x => x.rpe).filter(x => x != null);
    // "3×8 @ 60 kg · RPE 8 · 26 ott": ripetizioni uguali raggruppate, altrimenti elencate
    const rip = serie.map(x => x.ripetizioni ?? '–');
    const ripTesto = rip.every(x => x === rip[0]) ? `${serie.length}×${rip[0]}` : rip.join('/');
    const testo = ripTesto + (kg ? ` @ ${numero(kg)} kg` : '') + (rpe.length ? ` · RPE ${numero(Math.max(...rpe))}` : '') + ` · ${dataBreve(serie[0].sessioni?.data)}`;
    ris[id] = { testo, kg: kg || null };
  });
  return ris;
}

// Il riquadro cresce con il testo: niente più indicazioni tagliate
function adatta(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
window.addEventListener('resize', () => document.querySelectorAll('#corpoRighe textarea').forEach(adatta));

function aggiungiRiga() {
  const g = bozza.righe.length ? bozza.righe[bozza.righe.length - 1].giorno : 1;
  const ultima = bozza.righe[bozza.righe.length - 1];
  bozza.righe.push({ giorno: g, sezione: ultima?.sezione || '', nome: '', serie: 3, ripetizioni: '10', carico: '', rpe: '', recupero: '', indicazioni: '', note: '' });
  salvaBozza(); disegnaAnteprima();
}

// ---------------------------------------------------------------------
// Salvataggio: libreria esercizi → scheda → righe → assegnazione
// ---------------------------------------------------------------------
async function salvaScheda(btn) {
  const nome = ($('nomeScheda').value || '').trim();
  const pazienteId = $('pazienteScheda').value;
  const righe = bozza.righe.filter(r => r.nome.trim());
  if (!nome) { $('nomeScheda').focus(); return toast('Dai un nome alla scheda'); }
  if (!righe.length) return toast('La scheda non ha esercizi');
  const paz = pazienti.find(p => p.id === pazienteId);

  attesa(btn, true, 'Salvo…');
  try {
    // 1. esercizi: usa quelli in libreria (senza badare a maiuscole), crea i mancanti
    await caricaEsercizi();
    const perNome = new Map(esercizi.map(e => [e.nome.toLowerCase(), e.id]));
    const mancanti = [...new Map(righe.map(r => r.nome.trim()).filter(n => !perNome.has(n.toLowerCase())).map(n => [n.toLowerCase(), n])).values()];
    if (mancanti.length) {
      const { data, error } = await sb.from('esercizi').insert(mancanti.map(n => ({ nome: n }))).select('id, nome');
      if (error) throw error;
      data.forEach(e => perNome.set(e.nome.toLowerCase(), e.id));
    }

    // 2. scheda
    const { data: scheda, error: e2 } = await sb.from('schede')
      .insert({ nome, indicazioni: (bozza.indicazioni || '').trim() || null, creata_da: mioId }).select('id').single();
    if (e2) throw e2;

    // 3. righe, con l'ordine dentro ogni giorno
    const contatore = {};
    const daInserire = righe.map(r => ({
      scheda_id: scheda.id,
      esercizio_id: perNome.get(r.nome.trim().toLowerCase()),
      giorno: Math.min(7, Math.max(1, Number(r.giorno) || 1)),
      ordine: (contatore[r.giorno] = (contatore[r.giorno] || 0) + 1),
      serie: r.serie ? Math.min(20, Math.max(1, Number(r.serie))) : null,
      ripetizioni: (r.ripetizioni || '').trim() || null,
      carico: (r.carico || '').trim() || null,
      sezione: (r.sezione || '').trim() || null,
      rpe: (r.rpe || '').trim() || null,
      recupero: (r.recupero || '').trim() || null,
      indicazioni: (r.indicazioni || '').trim() || null,
      note: (r.note || '').trim() || null
    }));
    const { error: e3 } = await sb.from('scheda_esercizi').insert(daInserire);
    if (e3) throw e3;

    // 4. assegnazione: la nuova sostituisce quella attiva del paziente
    if (pazienteId) {
      const { error: e4 } = await sb.from('assegnazioni')
        .update({ stato: 'conclusa', data_fine: oggiRoma() }).eq('paziente_id', pazienteId).eq('stato', 'attiva');
      if (e4) throw e4;
      const { error: e5 } = await sb.from('assegnazioni').insert({ paziente_id: pazienteId, scheda_id: scheda.id });
      if (e5) throw e5;
      if (paz && !paz.attivo) await sb.from('profili').update({ attivo: true }).eq('id', pazienteId);
    }

    togliBozza(bozza.pazienteId);
    bozza = null;
    toast(pazienteId ? `Scheda salvata e assegnata a ${paz ? nomeCompleto(paz) : 'paziente'}` : 'Scheda salvata come modello');
    location.hash = pazienteId ? '#paziente/' + pazienteId : '#schede';
  } catch (err) {
    attesa(btn, false);
    errore(err, 'Scheda non salvata');
  }
}

// Carica una scheda esistente nell'editor (per modificarla o riusarla come modello)
async function modelloDaScheda(schedaId, pazienteId) {
  const { data, error } = await sb.from('schede')
    .select('nome, indicazioni, scheda_esercizi ( id, esercizio_id, giorno, ordine, serie, ripetizioni, carico, sezione, rpe, recupero, indicazioni, note, esercizi ( nome ) )')
    .eq('id', schedaId).single();
  if (error) return errore(error);
  const fatto = await ultimeEsecuzioni(data.scheda_esercizi.map(r => r.esercizio_id), pazienteId);
  bozza = {
    nome: data.nome, indicazioni: data.indicazioni || '', testo: '', pazienteId: pazienteId || '',
    righe: data.scheda_esercizi.sort((a, b) => a.giorno - b.giorno || a.ordine - b.ordine).map(r => ({
      giorno: r.giorno, nome: r.esercizi?.nome || '', serie: r.serie, ripetizioni: r.ripetizioni || '',
      carico: r.carico || '', sezione: r.sezione || '',
      rpe: r.rpe || '', recupero: r.recupero || '', indicazioni: r.indicazioni || '', note: r.note || '',
      ultimo: fatto[r.esercizio_id] || null,
      caricoScheda: r.carico || ''   // punto di partenza fisso: ripetere "Applica" non somma due volte
    }))
  };
  salvaBozza();
  if (location.hash === '#nuova' + (pazienteId ? '/' + pazienteId : '')) instrada();
  else location.hash = '#nuova' + (pazienteId ? '/' + pazienteId : '');
}

async function eliminaScheda(id, btn) {

// ESERCIZI (libreria)
// =====================================================================
async function caricaEsercizi() {
  const { data, error } = await sb.from('esercizi').select('*').order('nome');
  if (error) throw error;
  esercizi = data;
}

async function vistaEsercizi() {
  try { await caricaEsercizi(); } catch (err) { return errore(err, 'Esercizi non caricati'); }
  $('pagina').innerHTML = `
    <h1>Esercizi</h1>
    <p class="sotto">${esercizi.length} esercizi in libreria. Si aggiungono da soli quando salvi una scheda. Qui puoi aggiungere descrizione, video e immagine: il paziente li vede durante l'allenamento.</p>
    <input class="cerca" id="cercaEs" placeholder="Cerca esercizio…" oninput="filtraEsercizi()">
    <div id="elencoEs"></div>`;
  filtraEsercizi();
}

function filtraEsercizi() {
  const q = ($('cercaEs')?.value || '').toLowerCase().trim();
  const lista = esercizi.filter(e => !q || e.nome.toLowerCase().includes(q));
  if (!lista.length) { $('elencoEs').innerHTML = `<div class="card vuoto">${esercizi.length ? 'Nessun risultato.' : 'La libreria è vuota: si riempie quando salvi la prima scheda.'}</div>`; return; }
  $('elencoEs').innerHTML = lista.map(e => `
    <details class="esercizio">
      <summary><b>${esc(e.nome)}</b>
        <span>${e.link_video ? '<span class="badge ok">Video</span> ' : ''}${e.link_immagine ? '<span class="badge ok">Immagine</span>' : ''}</span></summary>
      <form class="corpo" onsubmit="salvaEsercizio(event, '${e.id}')">
        <div class="campo"><label class="etichetta">Nome</label><input name="nome" value="${esc(e.nome)}" required></div>
        <div class="campo"><label class="etichetta">Descrizione (come si esegue)</label><textarea name="descrizione" rows="3">${esc(e.descrizione)}</textarea></div>
        <div class="griglia2">
          <div class="campo"><label class="etichetta">Link video</label><input name="link_video" type="url" placeholder="https://youtube.com/…" value="${esc(e.link_video)}"></div>
          <div class="campo"><label class="etichetta">Link immagine</label><input name="link_immagine" type="url" placeholder="https://…" value="${esc(e.link_immagine)}"></div>
        </div>
        <div class="campo"><label class="etichetta">Note interne</label><input name="note" value="${esc(e.note)}"></div>
        <div class="azioni">
          <button class="btn btn-sec btn-piccolo">Salva</button>
          <button type="button" class="btn btn-pericolo btn-piccolo" onclick="eliminaEsercizio('${e.id}')">Elimina</button>
        </div>
      </form>
    </details>`).join('');
}

async function salvaEsercizio(ev, id) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const dati = {};
  ['nome', 'descrizione', 'link_video', 'link_immagine', 'note'].forEach(k => dati[k] = (f.get(k) || '').trim() || null);
  if (!dati.nome) return toast('Il nome è obbligatorio');
  const { error } = await sb.from('esercizi').update(dati).eq('id', id);
  if (error) return errore(error, error.code === '23505' ? 'Esiste già un esercizio con questo nome' : 'Non salvato');
  Object.assign(esercizi.find(e => e.id === id), dati);
  toast('Esercizio salvato');
}

async function eliminaEsercizio(id) {
  if (!confirm('Eliminare questo esercizio dalla libreria?')) return;
  const { error } = await sb.from('esercizi').delete().eq('id', id);
  if (error) return toast(error.code === '23503' ? 'Non si può eliminare: è usato in una scheda' : 'Errore: ' + error.message);
  esercizi = esercizi.filter(e => e.id !== id);
  filtraEsercizi(); toast('Esercizio eliminato');
}

avvio();
</script>
