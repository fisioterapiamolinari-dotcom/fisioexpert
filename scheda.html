<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Componi scheda esercizi | Fisio Expert</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:#1a1a1a; --ink-soft:#4a4a4a; --ink-muted:#8a8a8a;
  --accent:#f47920; --accent-light:rgba(244,121,32,0.12); --accent-dark:#d4660e;
  --warm:#f8f4ef; --warm-dark:#ede8e0; --white:#fff;
  --border:rgba(26,26,26,0.1);
  --green:#2e9e5b; --rosso:#c0392b;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'Montserrat',system-ui,sans-serif;
}
body { font-family:var(--sans); background:var(--warm); color:var(--ink); line-height:1.55; padding-bottom:120px; }
.wrap { max-width:860px; margin:0 auto; padding:0 20px; }

header { background:var(--white); border-bottom:1px solid var(--border); padding:16px 0; }
header .wrap { display:flex; align-items:center; justify-content:space-between; }
.header-logo { height:36px; width:auto; display:block; }
.logo-fallback { display:none; font-family:var(--mono); font-weight:800; font-size:20px; letter-spacing:-.5px; }
.logo-fallback b { color:var(--accent); font-weight:inherit; }
.tag { font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-muted); }

h1 { font-family:var(--serif); font-weight:400; font-size:30px; margin:28px 0 4px; }
.sotto { color:var(--ink-soft); font-size:15px; margin-bottom:20px; }

.card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
.etichetta { font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-muted); margin-bottom:8px; display:block; }

input, select, textarea {
  width:100%; font-family:var(--sans); font-size:15px; color:var(--ink);
  padding:11px 13px; border:1px solid var(--border); border-radius:10px;
  background:var(--white); outline:none;
}
input:focus, select:focus, textarea:focus { border-color:var(--accent); }
textarea { resize:vertical; min-height:80px; }
.riga2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* Fasi */
.barra-fasi { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.pill { font-family:var(--mono); font-weight:700; font-size:12px; padding:9px 15px; border-radius:100px;
        border:1.5px solid var(--border); background:var(--white); color:var(--ink-soft); cursor:pointer; }
.pill.attiva { background:var(--accent); border-color:var(--accent); color:var(--white); }
.pill.aggiungi { border-style:dashed; color:var(--accent); }

/* Esercizi in scheda */
.es-riga { border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; background:var(--white); }
.es-testa { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.es-titolo { flex:1; font-weight:500; font-size:15px; }
.mini { background:none; border:1px solid var(--border); border-radius:8px; width:30px; height:30px;
        cursor:pointer; color:var(--ink-muted); font-size:14px; flex-shrink:0; }
.mini:hover { border-color:var(--accent); color:var(--accent); }
.mini.elimina:hover { border-color:var(--rosso); color:var(--rosso); }
.campi { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.campi label { font-family:var(--mono); font-weight:700; font-size:9px; letter-spacing:.5px;
               text-transform:uppercase; color:var(--ink-muted); display:block; margin-bottom:3px; }
.campi input { padding:8px 10px; font-size:14px; }
.campo-nota { margin-top:8px; }
.vuoto { color:var(--ink-muted); font-size:14px; padding:20px; text-align:center;
         border:1px dashed var(--border); border-radius:12px; }

/* Selettore libreria */
.filtri { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.filtri select, .filtri input { width:auto; flex:1; min-width:140px; }
.libreria { max-height:320px; overflow-y:auto; border:1px solid var(--border); border-radius:12px; }
.lib-voce { padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer; display:flex;
            justify-content:space-between; align-items:center; gap:10px; }
.lib-voce:last-child { border-bottom:none; }
.lib-voce:hover { background:var(--accent-light); }
.lib-nome { font-size:14px; }
.lib-area { font-family:var(--mono); font-weight:700; font-size:9px; letter-spacing:.5px;
            text-transform:uppercase; color:var(--ink-muted); flex-shrink:0; }

/* Barra salva */
.barra { position:fixed; left:0; right:0; bottom:0; background:var(--white);
         border-top:1px solid var(--border); padding:14px 20px; z-index:20; }
.barra .wrap { display:flex; gap:12px; align-items:center; }
.btn { font-family:var(--mono); font-weight:800; font-size:14px; letter-spacing:.5px;
       padding:15px 26px; border-radius:100px; border:none; cursor:pointer; }
.btn-primario { background:var(--accent); color:var(--white); flex:1; }
.btn-primario:active { background:var(--accent-dark); }
.btn-primario:disabled { background:var(--ink-muted); cursor:default; }
.btn-secondario { background:var(--white); color:var(--ink-soft); border:1.5px solid var(--border); }

/* Risultato */
.risultato { background:var(--white); border:2px solid var(--green); border-radius:16px; padding:20px; margin-bottom:16px; }
.link-box { background:var(--warm); border:1px solid var(--border); border-radius:10px; padding:12px;
            font-family:monospace; font-size:13px; word-break:break-all; margin:10px 0; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="https://fisioexpert.it" style="display:inline-flex;align-items:center;text-decoration:none">
      <img src="/logo.png" width="671" height="135" alt="fisio·expert" class="header-logo"
           onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='inline';">
      <span id="logoFallback" class="logo-fallback">fisio<b>·</b>expert</span>
    </a>
    <span class="tag">Componi scheda</span>
  </div>
</header>

<div class="wrap">
  <h1>Nuova scheda esercizi</h1>
  <p class="sotto">Scegli il paziente, componi le fasi, salva. Ti esce il link da mandare su WhatsApp.</p>

  <div id="risultato"></div>

  <!-- PAZIENTE -->
  <div class="card">
    <label class="etichetta">Paziente</label>
    <div class="riga2">
      <select id="selPaziente" onchange="cambiaPaziente()"></select>
      <input type="tel" id="telefono" placeholder="Telefono (senza +39)">
    </div>
    <div id="nomeLibero" style="display:none;margin-top:12px">
      <input type="text" id="nomeAltro" placeholder="Nome e cognome">
    </div>
  </div>

  <!-- FASI -->
  <div class="card">
    <label class="etichetta">Fasi del percorso</label>
    <div class="barra-fasi" id="barraFasi"></div>

    <div class="riga2" style="margin-bottom:16px">
      <div>
        <label class="etichetta">Nome di questa fase</label>
        <input type="text" id="nomeFase" oninput="rinominaFase(this.value)">
      </div>
      <div>
        <label class="etichetta">Sedute per sbloccare la successiva</label>
        <input type="number" id="sogliaFase" min="0" oninput="cambiaSoglia(this.value)"
               placeholder="0 = sblocco solo manuale">
      </div>
    </div>

    <label class="etichetta">Esercizi di questa fase</label>
    <div id="eserciziFase"></div>
  </div>

  <!-- LIBRERIA -->
  <div class="card">
    <label class="etichetta">Aggiungi dalla libreria</label>
    <div class="filtri">
      <select id="filtroArea" onchange="disegnaLibreria()"></select>
      <input type="text" id="cerca" placeholder="Cerca per nome…" oninput="disegnaLibreria()">
    </div>
    <div class="libreria" id="libreria"></div>
  </div>

  <!-- INDICAZIONI -->
  <div class="card">
    <label class="etichetta">Indicazioni generali (facoltative)</label>
    <textarea id="indicazioni" placeholder="Es. ghiaccio 15 minuti dopo ogni seduta. Se il dolore supera 6/10, fermati e scrivimi."></textarea>
  </div>
</div>

<div class="barra">
  <div class="wrap">
    <button class="btn btn-secondario" onclick="svuota()">Azzera</button>
    <button class="btn btn-primario" id="btnSalva" onclick="salva()">Salva e genera link</button>
  </div>
</div>

<script src="listapazienti.js"></script>
<script src="listaesercizi.js"></script>
<script>
/* ============================================================
   CONFIGURAZIONE
   ============================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyEjX6FDCMghnBoIIxOQG7YsX_vZklK6U_OuwN3ip3G7eq7m255kpn-6dAS4LIls1QyWQ/exec';
const BASE_SITO = 'https://fisioexpert.it';

/* ---------- Stato ---------- */
let fasi = [ nuovaFase('Fase 1') ];
let faseCorrente = 0;
let idScheda = '';   // valorizzato dopo il primo salvataggio

function nuovaFase(nome) {
  return { nome: nome, sbloccata: false, sogliaSessioni: 0, esercizi: [] };
}

/* ---------- Avvio ---------- */
function avvio() {
  const sel = document.getElementById('selPaziente');
  sel.innerHTML = '<option value="">— scegli —</option>';
  LISTA_PAZIENTI.forEach(function (p, i) {
    sel.innerHTML += '<option value="' + i + '">' + esc(p.nome) + '</option>';
  });
  sel.innerHTML += '<option value="altro">Altro (scrivo il nome)</option>';

  const fa = document.getElementById('filtroArea');
  fa.innerHTML = '<option value="">Tutte le aree</option>';
  AREE.forEach(function (a) { fa.innerHTML += '<option>' + esc(a) + '</option>'; });

  disegnaFasi();
  disegnaEsercizi();
  disegnaLibreria();
}

function cambiaPaziente() {
  const v = document.getElementById('selPaziente').value;
  const libero = document.getElementById('nomeLibero');
  if (v === 'altro') {
    libero.style.display = 'block';
    document.getElementById('telefono').value = '';
  } else {
    libero.style.display = 'none';
    if (v !== '') document.getElementById('telefono').value = LISTA_PAZIENTI[v].telefono || '';
  }
}

function nomePaziente() {
  const v = document.getElementById('selPaziente').value;
  if (v === 'altro') return document.getElementById('nomeAltro').value.trim();
  if (v === '') return '';
  return LISTA_PAZIENTI[v].nome;
}

/* ---------- Fasi ---------- */
function disegnaFasi() {
  const c = document.getElementById('barraFasi');
  c.innerHTML = '';
  fasi.forEach(function (f, i) {
    const b = document.createElement('button');
    b.className = 'pill' + (i === faseCorrente ? ' attiva' : '');
    b.textContent = f.nome + ' (' + f.esercizi.length + ')';
    b.onclick = function () { faseCorrente = i; disegnaFasi(); disegnaEsercizi(); };
    c.appendChild(b);
  });

  if (fasi.length < 6) {
    const piu = document.createElement('button');
    piu.className = 'pill aggiungi';
    piu.textContent = '+ fase';
    piu.onclick = function () {
      fasi.push(nuovaFase('Fase ' + (fasi.length + 1)));
      faseCorrente = fasi.length - 1;
      disegnaFasi(); disegnaEsercizi();
    };
    c.appendChild(piu);
  }

  if (fasi.length > 1) {
    const meno = document.createElement('button');
    meno.className = 'pill';
    meno.style.color = 'var(--rosso)';
    meno.textContent = '− elimina questa';
    meno.onclick = function () {
      if (!confirm('Elimino ' + fasi[faseCorrente].nome + '?')) return;
      fasi.splice(faseCorrente, 1);
      faseCorrente = Math.max(0, faseCorrente - 1);
      disegnaFasi(); disegnaEsercizi();
    };
    c.appendChild(meno);
  }

  document.getElementById('nomeFase').value = fasi[faseCorrente].nome;
  document.getElementById('sogliaFase').value = fasi[faseCorrente].sogliaSessioni || '';
}

function rinominaFase(v) { fasi[faseCorrente].nome = v; disegnaFasi(); }
function cambiaSoglia(v) { fasi[faseCorrente].sogliaSessioni = Number(v) || 0; }

/* ---------- Esercizi della fase ---------- */
function disegnaEsercizi() {
  const lista = fasi[faseCorrente].esercizi;
  const c = document.getElementById('eserciziFase');

  if (!lista.length) {
    c.innerHTML = '<div class="vuoto">Nessun esercizio. Scegline dalla libreria qui sotto.</div>';
    return;
  }

  let html = '';
  lista.forEach(function (e, i) {
    html += '<div class="es-riga">'
      + '<div class="es-testa">'
      +   '<span class="es-titolo">' + esc(e.nome) + '</span>'
      +   '<button class="mini" onclick="muovi(' + i + ',-1)" title="Su">&#8593;</button>'
      +   '<button class="mini" onclick="muovi(' + i + ',1)" title="Giù">&#8595;</button>'
      +   '<button class="mini elimina" onclick="togli(' + i + ')" title="Elimina">&times;</button>'
      + '</div>'
      + '<div class="campi">'
      +   campo(i, 'serie', 'Serie', e.serie)
      +   campo(i, 'rip', 'Ripetizioni', e.rip)
      +   campo(i, 'riposo', 'Riposo', e.riposo)
      +   campo(i, 'rpe', 'RPE', e.rpe)
      + '</div>'
      + '<div class="campo-nota">'
      +   '<label class="etichetta" style="margin-bottom:3px">Note</label>'
      +   '<input type="text" value="' + esc(e.note) + '" placeholder="Es. tenuta 2 secondi"'
      +     ' oninput="modifica(' + i + ',&quot;note&quot;,this.value)">'
      + '</div>'
      + '</div>';
  });
  c.innerHTML = html;
}

function campo(i, chiave, etichetta, valore) {
  return '<div><label>' + etichetta + '</label>'
       + '<input type="text" value="' + esc(valore) + '"'
       + ' oninput="modifica(' + i + ',&quot;' + chiave + '&quot;,this.value)"></div>';
}

function modifica(i, chiave, valore) { fasi[faseCorrente].esercizi[i][chiave] = valore; }

function togli(i) {
  fasi[faseCorrente].esercizi.splice(i, 1);
  disegnaEsercizi(); disegnaFasi();
}

function muovi(i, delta) {
  const lista = fasi[faseCorrente].esercizi;
  const j = i + delta;
  if (j < 0 || j >= lista.length) return;
  const tmp = lista[i]; lista[i] = lista[j]; lista[j] = tmp;
  disegnaEsercizi();
}

/* ---------- Libreria ---------- */
function disegnaLibreria() {
  const area = document.getElementById('filtroArea').value;
  const q = document.getElementById('cerca').value.toLowerCase().trim();

  const c = document.getElementById('libreria');
  let html = '';
  let trovati = 0;

  LIBRERIA_ESERCIZI.forEach(function (e, indice) {
    if (area && e.area !== area) return;
    if (q && e.nome.toLowerCase().indexOf(q) === -1) return;
    trovati++;
    html += '<div class="lib-voce" onclick="aggiungi(' + indice + ')">'
          + '<span class="lib-nome">' + esc(e.nome) + '</span>'
          + '<span class="lib-area">' + esc(e.area) + '</span>'
          + '</div>';
  });

  c.innerHTML = trovati ? html : '<div class="vuoto" style="border:none">Nessun esercizio trovato.</div>';
}

function aggiungi(indice) {
  const e = LIBRERIA_ESERCIZI[indice];
  fasi[faseCorrente].esercizi.push({
    nome: e.nome, serie: e.serie, rip: e.rip,
    riposo: e.riposo || '60s', rpe: e.rpe || '',
    note: e.note || '', desc: e.desc || ''
  });
  disegnaEsercizi(); disegnaFasi();
}

/* ---------- Salvataggio ---------- */
async function salva() {
  const paziente = nomePaziente();
  if (!paziente) { alert('Scegli o scrivi il nome del paziente.'); return; }
  if (!fasi[0].esercizi.length) { alert('La prima fase è vuota: aggiungi almeno un esercizio.'); return; }

  const btn = document.getElementById('btnSalva');
  btn.disabled = true;
  btn.textContent = 'Salvo…';

  const daInviare = fasi.map(function (f, i) {
    return { nome: f.nome, sbloccata: i === 0, sogliaSessioni: f.sogliaSessioni || 0, esercizi: f.esercizi };
  });

  try {
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'salvaScheda',
        id: idScheda,
        paziente: paziente,
        telefono: document.getElementById('telefono').value.trim(),
        faseAttiva: 0,
        indicazioni: document.getElementById('indicazioni').value.trim(),
        fasi: daInviare
      })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.errore || 'Errore sconosciuto');

    idScheda = d.id;
    mostraLink(d.id, paziente);
  } catch (e) {
    alert('Non sono riuscito a salvare: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salva e genera link';
  }
}

function mostraLink(id, paziente) {
  const link = BASE_SITO + '/paziente.html?id=' + id;
  const tel = document.getElementById('telefono').value.replace(/\D/g, '');
  const testo = encodeURIComponent(
    'Ciao ' + paziente.split(' ')[0] + ', ecco la tua scheda esercizi:\n' + link +
    '\n\nAprila e aggiungila alla schermata Home del telefono. Segna "Fatto" ogni volta che la completi.'
  );
  const wa = tel ? 'https://wa.me/39' + tel + '?text=' + testo : '';

  document.getElementById('risultato').innerHTML =
      '<div class="risultato">'
    + '<label class="etichetta" style="color:var(--green)">Scheda salvata</label>'
    + '<div class="link-box">' + link + '</div>'
    + '<div style="display:flex;gap:10px;flex-wrap:wrap">'
    +   '<button class="btn btn-secondario" onclick="copia(&quot;' + link + '&quot;)">Copia link</button>'
    + (wa ? '<a class="btn btn-primario" style="text-decoration:none;flex:0;display:inline-block" href="' + wa + '" target="_blank">Manda su WhatsApp</a>' : '')
    +   '<a class="btn btn-secondario" style="text-decoration:none" href="' + link + '" target="_blank">Apri anteprima</a>'
    + '</div>'
    + '<p style="font-size:13px;color:var(--ink-muted);margin-top:12px">'
    +   'Se modifichi e risalvi, il link resta lo stesso: il paziente vedrà la versione aggiornata.'
    + '</p>'
    + '</div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copia(testo) {
  navigator.clipboard.writeText(testo).then(function () { alert('Link copiato.'); });
}

function svuota() {
  if (!confirm('Azzero tutto e ricomincio?')) return;
  fasi = [ nuovaFase('Fase 1') ];
  faseCorrente = 0;
  idScheda = '';
  document.getElementById('selPaziente').value = '';
  document.getElementById('telefono').value = '';
  document.getElementById('nomeAltro').value = '';
  document.getElementById('nomeLibero').style.display = 'none';
  document.getElementById('indicazioni').value = '';
  document.getElementById('risultato').innerHTML = '';
  disegnaFasi(); disegnaEsercizi();
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

avvio();
</script>

</body>
</html>
